services:
  - type: web
    name: khaaos-run-staging
    runtime: node
    branch: main
    buildCommand: >-
      npm ci --include=dev --no-audit --no-fund && npm run build &&
      node scripts/write-render-health.mjs
    startCommand: npm start
    autoDeployTrigger: "off"
    healthCheckPath: /healthz.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_DB_MIGRATIONS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WS_TOKEN_SECRET
        sync: false
      - key: REPL_ID
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_REQUIRED
        value: "true"
      - key: REDIS_NAMESPACE
        value: khaaos
      - key: ZONE_OPERATOR_IDS
        sync: false
      - key: MARSHAL_CONSOLE_OPERATOR_IDS
        sync: false
