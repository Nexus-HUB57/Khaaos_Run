; These settings are applied when the server is launched with -production flag
; or when bIsProduction=True in the production config subsystem.
; =============================================================================

[/Script/KhaaosRun.KhaaosProductionConfig]
bIsProduction=True
bRequireAuthentication=True
bRequireAntiCheat=True
bEnableRateLimiting=True
bEnableDDoSProtection=True
MaxConcurrentConnections=1000
MaxConnectionsPerIP=5
RequestRateLimitPerMinute=60
bEnableMetricsCollection=True
bEnableCrashReporting=True
bEnableProfiling=False

[/Script/KhaaosRun.KhaaosServerConfig]
; Server defaults for production
MaxPlayers=100
TickRate=60
bIsDedicated=True
Region=us-east-1
bAutoBalanceTeams=False

[/Script/KhaaosRun.KhaaosServerConfig.NetworkConfig]
ListenPort=7777
BeaconPort=7778
QueryPort=27015
NetServerMaxTickRate=60
TimeoutSeconds=30.0
bUseIris=True

[/Script/KhaaosRun.KhaaosAntiCheat]
bAutoKickOnCheat=True
CheatStrikeThreshold=3
MaxSpeedTolerance=1.2
MaxAccuracyBeforeSuspicious=0.85
MinShotsForAimbotAnalysis=50
MaxMovementPerSecond=1200.0
MaxHeightAboveGround=500.0
MaxTeleportDistance=5000.0
MinTimeBetweenShots=0.1

[/Script/KhaaosRun.KhaaosDDoSProtection]
bProtectionEnabled=True
MaxConnectionsPerSecond=50
MaxConnectionsPerIP=5
ConnectionWindowSeconds=10.0
bAutoBlockIPs=True
BlockDurationMinutes=30.0

[/Script/KhaaosRun.KhaaosRateLimiter]
bAutoThrottle=True

[/Script/KhaaosRun.KhaaosMonitorDashboard]
bIsMonitoring=True
MetricsCollectionIntervalSeconds=5.0

[/Script/Engine.Engine]
; Lock frame rate for consistent server ticks
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=60.0),UpperBound=(Type=Exclusive,Value=62.0))
bUseFixedFrameRate=False

[/Script/Engine.GameSession]
MaxPlayers=100
bRequiresPushModel=True

[/Script/Engine.NetworkSettings]
; Iris replication for efficient bandwidth
NetServerMaxTickRate=60
MaxClientUpdateRate=60
NetConnectionTimeout=30.0

[/Script/OnlineSubsystemOnlineServices.OnlineServicesEOS]
; EOS production configuration (secrets via environment variables)
bUseEAS=True

[/Script/GarbageCollectionSettings]
; Optimized GC for server workloads
gc.IncrementalTimeBudget=2.0
gc.MaxObjectsInGame=1048576
gc.MaxObjectsNotConsideredByGC=1048576
