; ─── Sector Layout ───────────────────────────────────────────────────────────
; ArmoryHub: 1/8 (12.5%) — neutral zone, loadout, no combat
; ProvingGrounds: 3/8 (37.5%) — urban dense, destructible buildings, tunnels
; Park: 4/8 (50.0%) — vegetation, rivers, ambushes, ZEX-rich

[/Script/KhaaosRun.KhaaosCIGKVZuConfig]
; ─── Zu Entry Protocol ──────────────────────────────────────────────────────
; 3 cinematic entry variants per CIGKV design document
; Zu1: Caminhão atropela bois → apertar cinto (8s cinematic)
; Zu2: Capota com rocha → saltar (6s cinematic)
; Zu3: Cai da ponte → máscara O2 (7s cinematic)
; Correct decision: 0 damage + possible stun (5-7s)
; Wrong decision: up to -30% health
Zu1_WrongDecisionDamage=0.30
Zu2_WrongDecisionDamage=0.25
Zu3_WrongDecisionDamage=0.30
Zu1_CinematicDuration=8.0
Zu2_CinematicDuration=6.0
Zu3_CinematicDuration=7.0

[/Script/KhaaosRun.KhaaosCIGKVDedoDuro]
; ─── Inactivity System ("dedo-duro") ────────────────────────────────────────
; Punishes players who avoid combat
; Rats: damage over time (minor, constant nagging)
; Mosquitoes: vision blur (reduces awareness)
; Locusts: loot destruction (nearby loot gets destroyed)
; Seagulls: position reveal (shows on minimap to enemies)
bEnabled=true
InactivityDamageRamp=true
DedoDuroTypes=Rats,Mosquitoes,Locusts,Seagulls
RatsDamagePerSecond=1.0
MosquitoesBlurIntensity=0.3
LocustsRadius=500.0
SeagullsRevealDuration=5.0
