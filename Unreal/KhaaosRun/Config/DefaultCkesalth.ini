; ============================================================================
; Khaaos Run — W3/C3 Ckesalth Configuration (Fase 4)
; ============================================================================
; Mundo vertical montanhoso
; 60 players, 1.5h Ring, 4 zone phases (Base→Mid→Peak→Summit)
; ============================================================================

[Ckesalth.Map]
MapName=W3/C3 Ckesalth
MapDescription=Mundo vertical montanhoso — Climbing, ziplines, elevation advantage
MapSizeX=6000.0
MapSizeY=6000.0
MapSizeZ=2000.0
MaxPlayers=60
RingDuration=5400.0
EntryBlockTime=180.0
PulsoKhaaosInterval=480.0
MinW2MatchesForEntry=5
KRCEarnMultiplier=2.5

[Ckesalth.Inactivity]
InactivityThreshold=100.0
InactivityDamagePerSecond=2.5

[Ckesalth.Vertical]
; Altitude where thin air damage starts (meters)
ThinAirThreshold=1500.0
; Thin air damage per second above threshold
ThinAirDamagePerSecond=1.0
; Elevation advantage minimum for damage bonus
ElevationAdvantageMinHeight=100.0
; Fall damage multiplier (higher than other worlds due to cliffs)
FallDamageMultiplier=1.5

[Ckesalth.Zone.Phase0]
PhaseIndex=0
PhaseStartTime=0.0
PhaseName=Base
ZoneRadius=3000.0
ZoneDamagePerSecond=2.0
LootDropCount=10
ClimateEffect=Clear
MinAltitude=0
MaxAltitude=2000
AltitudeDamageModifier=1.0

[Ckesalth.Zone.Phase1]
PhaseIndex=1
PhaseStartTime=1350.0
PhaseName=MidMountain
ZoneRadius=2200.0
ZoneDamagePerSecond=5.0
LootDropCount=8
ClimateEffect=Wind
MinAltitude=300
MaxAltitude=2000
AltitudeDamageModifier=1.2

[Ckesalth.Zone.Phase2]
PhaseIndex=2
PhaseStartTime=2700.0
PhaseName=PeakZone
ZoneRadius=1500.0
ZoneDamagePerSecond=8.0
LootDropCount=6
ClimateEffect=Snow
MinAltitude=800
MaxAltitude=2000
AltitudeDamageModifier=1.5

[Ckesalth.Zone.Phase3]
PhaseIndex=3
PhaseStartTime=4200.0
PhaseName=SummitArena
ZoneRadius=600.0
ZoneDamagePerSecond=12.0
LootDropCount=4
ClimateEffect=Blizzard
MinAltitude=1200
MaxAltitude=2000
AltitudeDamageModifier=2.0

[Ckesalth.ZEX]
TotalZEX=25
; Higher altitude ZEX have higher XP bonus
AltitudeBonusScaling=true

[Ckesalth.Zu]
Zu1_Cinto=true
Zu2_Saltar=true
Zu3_Escalando=true

[Ckesalth.Sectors]
; 4 sectors: BaseCamp(2/8), MidMountain(3/8), PeakZone(2/8), SummitArena(1/8)
SectorCount=4
BaseCamp_Fraction=0.25
MidMountain_Fraction=0.375
PeakZone_Fraction=0.25
SummitArena_Fraction=0.125

[Ckesalth.Spawns]
TotalSpawnPoints=60
BaseCampSpawns=15
MidMountainSpawns=20
PeakZoneSpawns=15
SummitArenaSpawns=10

[Ckesalth.Loot]
TotalLootPoints=80
BaseCampLoot=20
MidMountainLoot=30
PeakZoneLoot=20
SummitArenaLoot=10
; Loot at higher altitudes requires climbing
ClimbingRequiredAboveAlt=600

[Ckesalth.Economy]
KRCEarnRate=2.5
LootValueMultiplier=1.4
ExtractionBonus=1.3
; Altitude bonus: higher extractions worth more
AltitudeExtractionBonus=0.25

[Ckesalth.Entry]
MinW2Matches=5
MinPlayerLevel=0
RequiredWorld=W2
