; ─── Matchmaking Configuration ───────────────────────────────────────────────

[/Script/KhaaosRun.MatchmakingProduction]
; Skill-based matchmaking with regional pools
MatchmakingAlgorithm=SkillBasedMMR
; MMR range for matching: +/- this value
MMRSpread=200
; Time before expanding MMR spread
MMRExpandTimeSeconds=30
; Max MMR spread after expansion
MMRMaxSpread=500
; Minimum players to start a match
MinPlayersToStart=10
; Preferred match size
PreferredMatchSize=50
; Maximum wait time before starting with fewer players
MaxWaitTimeSeconds=120
; Team balancing: max skill difference between teams
MaxTeamSkillDelta=100

; ─── Session Template ────────────────────────────────────────────────────────

[/Script/KhaaosRun.SessionTemplate_CIGKV]
TemplateName=Khaaos_CIGKV_50p
MapId=CIGKV_KhaaosVille
GameMode=KhaaosGameMode
MaxPlayers=50
MinPlayers=10
bAllowJoinInProgress=true
bAllowSpectators=false
SessionTimeoutMinutes=180     ; 3h Ring duration
AutoStartWhenFull=false       ; Host controls start
AutoStartMinPlayers=10        ; Or start when 10 players ready
KickInactiveAfterSeconds=300  ; 5 min AFK = kick

; ============================================================================
; Fase 2: Production Overrides — Cache, Timeouts, Rate Limiting, Cloud Save, EAC
; ============================================================================

; ─── EOS Cache Settings ────────────────────────────────────────────────────────

[/Script/KhaaosRun.EOSCacheConfig]
; Cache sizes para reduzir chamadas ao EOS API em produção
; Valores otimizados para 50 players por servidor
AuthCacheSize=128                ; Max cached auth tokens
FriendsCacheSize=256             ; Max cached friend lists
PresenceCacheSize=256            ; Max cached presence entries
SessionCacheSize=64              ; Max cached sessions
LobbyCacheSize=64                ; Max cached lobbies
UserInfoCacheSize=256            ; Max cached user info entries
; Cache TTL em segundos
AuthCacheTTLSeconds=3600         ; 1h — auth tokens são long-lived
FriendsCacheTTLSeconds=300       ; 5min — friends list não muda frequentemente
PresenceCacheTTLSeconds=30       ; 30s — presence muda frequentemente
SessionCacheTTLSeconds=60        ; 1min — sessions update com heartbeat
LobbyCacheTTLSeconds=60          ; 1min — lobbies update com heartbeat
UserInfoCacheTTLSeconds=1800     ; 30min — user info raramente muda

; ─── EOS Timeout Overrides ─────────────────────────────────────────────────────

[/Script/KhaaosRun.EOSTimeoutConfig]
; Timeouts para chamadas EOS API em produção (ms)
; Valores mais agressivos que dev para evitar hangs
AuthTimeoutMs=10000              ; 10s — login/logout
FriendsTimeoutMs=5000            ; 5s — friend operations
PresenceTimeoutMs=3000           ; 3s — presence updates
SessionTimeoutMs=10000           ; 10s — session create/join/destroy
LobbyTimeoutMs=10000             ; 10s — lobby create/join/destroy
MatchmakingTimeoutMs=15000       ; 15s — matchmaking submit/cancel
CloudStorageTimeoutMs=15000      ; 15s — cloud save upload/download
StatsTimeoutMs=5000              ; 5s — stats ingest/query
AchievementsTimeoutMs=5000       ; 5s — achievement operations
AntiCheatTimeoutMs=5000          ; 5s — EAC operations
; Connection timeout para EOS platform
PlatformConnectionTimeoutMs=30000  ; 30s — initial connection
; Retry timeout (tempo máximo esperando retry)
RetryTotalTimeoutMs=60000       ; 60s — tempo total de retry

; ─── EOS Rate Limiting ─────────────────────────────────────────────────────────

[/Script/KhaaosRun.EOSRateLimitConfig]
; Rate limiting para evitar throttle do EOS API
; Valores por segundo (max calls/s)
AuthRateLimitPerSecond=5         ; Max auth calls/s
FriendsRateLimitPerSecond=10     ; Max friend calls/s
PresenceRateLimitPerSecond=20    ; Max presence calls/s (high freq)
SessionRateLimitPerSecond=5      ; Max session calls/s
LobbyRateLimitPerSecond=5        ; Max lobby calls/s
MatchmakingRateLimitPerSecond=2  ; Max matchmaking calls/s (heavy)
CloudStorageRateLimitPerSecond=1 ; Max cloud save calls/s (heavy)
StatsRateLimitPerSecond=10       ; Max stats calls/s
AchievementsRateLimitPerSecond=5 ; Max achievement calls/s
AntiCheatRateLimitPerSecond=10   ; Max EAC calls/s
; Burst allowance (permite até N calls extras em burst)
RateLimitBurstAllowance=3
; Cooldown após rate limit hit (ms)
RateLimitCooldownMs=1000

; ─── Cloud Save Production ─────────────────────────────────────────────────────

[/Script/KhaaosRun.CloudSaveProduction]
; Configuração do UKhaaosCloudSaveProduction
bAutoSaveEnabled=true            ; Auto-save habilitado
AutoSaveInterval=120.0           ; 2min entre auto-saves
bCompressionEnabled=true         ; LZ4 compressão habilitada
DefaultMergeStrategy=MergeBoth   ; Merge campo-a-campo (stats→Server, cosméticos→Client)
MaxRetryCount=5                  ; Max retries em falha de rede
RetryBaseDelaySeconds=1.0        ; Delay base para exponential backoff
RetryMaxDelaySeconds=30.0        ; Delay máximo para retry
CurrentSaveVersion=3             ; Versão atual do schema de save
; Limites de tamanho
MaxSaveSizeBytes=1048576         ; 1MB máximo por save (descomprimido)
MaxSaveSlotsPerUser=10           ; Máximo de slots por usuário
MaxMatchHistoryEntries=50        ; Máximo de resultados de match no histórico
; Checksum e integridade
bValidateChecksumOnLoad=true     ; Validar SHA1 checksum no load
bRejectCorruptedSaves=true       ; Rejeitar saves com checksum inválido

; ─── Easy Anti-Cheat Production ────────────────────────────────────────────────

[/Script/KhaaosRun.EACProduction]
; Configuração do UKhaaosEACIntegration
bEACEnabled=true                 ; EAC habilitado em produção
bEACMandatory=true               ; EAC obrigatório (kick sem EAC)
EACSdkPath=EasyAntiCheat         ; Caminho do EAC SDK
ValidationPollInterval=30.0      ; Validar sessões a cada 30s
MaxViolationsBeforeKick=3        ; 3 violações = kick
bLogInformationalViolations=true ; Log violations informativas
; EAC Server config
EACServerPort=8577               ; Porta do EAC server
EACServerTimeout=30              ; Timeout do EAC server (s)
EACMaxClients=100                ; Max clientes EAC simultâneos
; Severidade → Strike mapping
EACInformationalStrikes=0        ; Informational = 0 strikes
EACMinorStrikes=1                ; Minor = 1 strike
EACMajorStrikes=2                ; Major = 2 strikes
EACCriticalStrikes=3             ; Critical = 3 strikes (auto-kick)
; EAC Logging
bEACLoggingEnabled=true
EACLogLevel=info                 ; debug, info, warning, error
EACLogFile=eac_production.log

; ─── Anti-Cheat Polling Intervals ─────────────────────────────────────────────

[/Script/KhaaosRun.AntiCheatPolling]
; Intervalos de polling para validação anti-cheat
MovementValidationIntervalMs=100   ; Validar movimento a cada 100ms
ShotValidationIntervalMs=50        ; Validar shots a cada 50ms
DamageValidationIntervalMs=100     ; Validar damage a cada 100ms
ItemPickupValidationIntervalMs=200 ; Validar item pickup a cada 200ms
EACSessionValidationIntervalMs=30000 ; Validar EAC session a cada 30s
MetricsReportIntervalMs=60000      ; Reportar métricas a cada 60s
; Thresholds
SuspicionScoreThreshold=50.0       ; Score acima = investigar
AutoKickStrikeThreshold=3          ; Strikes = kick (igual KhaaosAntiCheat)
MaxSpeedToleranceMultiplier=1.2    ; 20% acima do speed esperado
MaxAccuracyBeforeSuspicious=0.85   ; 85% accuracy = suspeito de aimbot

; ─── EOS Platform Overrides ────────────────────────────────────────────────────

[/Script/EOSIntegrationKit.EOSIntegrationKitSettings]
; Overrides de produção para o EOSIntegrationKit
bEnableOverlay=True              ; Overlay do Epic em produção
bEnableOverlaySocial=True        ; Social overlay
bEnableOverlayFriends=True       ; Friends overlay
bEnableOverlayPresence=True      ; Presence overlay
bUseEAS=True                     ; Epic Account Services
; Tick rate para EOS callback pumping
EOSPlatformTickRateHz=60         ; 60 ticks/s para callbacks EOS

; ─── Production Monitoring ────────────────────────────────────────────────────

[/Script/KhaaosRun.EOSMonitoring]
; Configuração de monitoring para Prometheus/Grafana
bMetricsEnabled=true             ; Métricas habilitadas
MetricsPort=9090                 ; Porta do metrics endpoint
MetricsPath=/metrics             ; Path do Prometheus metrics
; Alertas
AlertOnAuthFailure=true          ; Alertar em falha de auth
AlertOnMatchmakingTimeout=true   ; Alertar em timeout de matchmaking
AlertOnEACViolation=true         ; Alertar em violação EAC
AlertOnCloudSaveFailure=true     ; Alertar em falha de cloud save
AlertOnHighPing=true             ; Alertar em ping alto
HighPingThresholdMs=200          ; Threshold de ping alto
; Dashboard
DashboardRefreshIntervalMs=5000  ; 5s refresh do dashboard
