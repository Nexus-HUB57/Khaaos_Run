; ============================================================================
; Khaaos Run — EOS Production Configuration per Region (Fase 2)
; ============================================================================
; Multi-region EOS deployment for production matchmaking
; Regions: sa1 (South America), na1 (North America), eu1 (Europe)
; ============================================================================

[/Script/KhaaosRun.EOSProductionConfig]
; ─── Global EOS Settings ─────────────────────────────────────────────────────
; These MUST be set with real values from Epic Developer Portal
; https://dev.epicgames.com/portal/
; ProductId, SandboxId, DeploymentId — obtain from Epic after app registration

bEOSProductionEnabled=true
EOSProductId=           ; SET: Real Product ID from Epic
EOSSandboxId=           ; SET: Real Sandbox ID from Epic
EOSDeploymentId=        ; SET: Real Deployment ID from Epic
EOSClientClientId=      ; SET: Client ID for player auth
EOSClientClientSecret=  ; SET: Client Secret (STORE AS GITHUB SECRET!)

; ─── Region: sa1 (South America — São Paulo) ─────────────────────────────────

[/Script/KhaaosRun.EOSRegionConfig_sa1]
RegionId=sa1
RegionName=South America - Sao Paulo
RegionEndpoint=eos-sa1.epicgames.com
Latitude=-23.5505
Longitude=-46.6333
MaxLobbySize=100
MaxPlayersPerServer=50
MatchmakingPool=KR_SA1
bEnabled=true
PingThreshold=150         ; Max acceptable ping (ms)
PreferredDataCenter=sa1

; ─── Region: na1 (North America — Virginia) ──────────────────────────────────

[/Script/KhaaosRun.EOSRegionConfig_na1]
RegionId=na1
RegionName=North America - Virginia
RegionEndpoint=eos-na1.epicgames.com
Latitude=37.4316
Longitude=-78.6569
MaxLobbySize=100
MaxPlayersPerServer=50
MatchmakingPool=KR_NA1
bEnabled=true
PingThreshold=100
PreferredDataCenter=na1

; ─── Region: eu1 (Europe — Frankfurt) ────────────────────────────────────────

[/Script/KhaaosRun.EOSRegionConfig_eu1]
RegionId=eu1
RegionName=Europe - Frankfurt
RegionEndpoint=eos-eu1.epicgames.com
Latitude=50.1109
Longitude=8.6821
MaxLobbySize=100
MaxPlayersPerServer=50
MatchmakingPool=KR_EU1
bEnabled=true
PingThreshold=100
PreferredDataCenter=eu1

; ─── Matchmaking Configuration ───────────────────────────────────────────────

[/Script/KhaaosRun.MatchmakingProduction]
; Skill-based matchmaking with regional pools
MatchmakingAlgorithm=SkillBasedMMR
; MMR range for matching: +/- this value
MMRSpread=200
; Time before expanding MMR spread
MMRExpandTimeSeconds=30
; Max MMR spread after expansion
MMRMaxSpread=500
; Minimum players to start a match
MinPlayersToStart=10
; Preferred match size
PreferredMatchSize=50
; Maximum wait time before starting with fewer players
MaxWaitTimeSeconds=120
; Team balancing: max skill difference between teams
MaxTeamSkillDelta=100

; ─── Session Template ────────────────────────────────────────────────────────

[/Script/KhaaosRun.SessionTemplate_CIGKV]
TemplateName=Khaaos_CIGKV_50p
MapId=CIGKV_KhaaosVille
GameMode=KhaaosGameMode
MaxPlayers=50
MinPlayers=10
bAllowJoinInProgress=true
bAllowSpectators=false
SessionTimeoutMinutes=180     ; 3h Ring duration
AutoStartWhenFull=false       ; Host controls start
AutoStartMinPlayers=10        ; Or start when 10 players ready
KickInactiveAfterSeconds=300  ; 5 min AFK = kick
