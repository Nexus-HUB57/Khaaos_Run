; Khaaos Run mobile baseline (UE 5.8)
; Keep desktop Lumen/Nanite settings from DefaultEngine.ini out of the Android cook.
; Midrange target uses baked/static lighting, reflection captures and authored LODs.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Nanite.ProjectEnabled=False
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False

[SystemSettings]
r.Mobile.ShadingPath=0

; Memory tiers intentionally require 3 GB at minimum for this BR vertical slice.
[PlatformMemoryBuckets]
LargestMemoryBucket_MinGB=8
LargerMemoryBucket_MinGB=6
DefaultMemoryBucket_MinGB=4
SmallerMemoryBucket_MinGB=3
SmallestMemoryBucket_MinGB=3

; Stable keys support a later recorded PSO-cache workflow for the shipped RHI.
[DevOptions.Shaders]
NeedsShaderStableKeys=true
