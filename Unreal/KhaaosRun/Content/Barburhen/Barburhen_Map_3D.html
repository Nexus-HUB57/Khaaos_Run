    #canvas-wrap { width: 100vw; height: 100vh; touch-action: none; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(10,14,12,0.88); border: 1px solid #3a5a48; border-radius: 8px;
      padding: 12px 16px; max-width: 320px; backdrop-filter: blur(8px);
    }
    #hud h1 { font-size: 16px; color: #f0e6d0; margin-bottom: 4px; }
    #hud p { font-size: 11px; color: #a09070; line-height: 1.4; }
    #legend {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(10,14,12,0.88); border: 1px solid #3a5a48; border-radius: 8px;
      padding: 10px 14px; font-size: 11px; line-height: 1.6;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    #controls {
      position: fixed; top: 12px; right: 12px; z-index: 10;
      background: rgba(10,14,12,0.88); border: 1px solid #3a5a48; border-radius: 8px;
      padding: 10px 14px; font-size: 11px;
    }
    button {
      background: #1a3028; color: #c8e0d0; border: 1px solid #4a7a60;
      padding: 6px 10px; margin: 2px; border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    button:hover { background: #2a4840; }
    button:focus-visible { outline: 2px solid #d3bd7b; outline-offset: 2px; }
    #info {
      position: fixed; bottom: 12px; right: 12px; z-index: 10;
      background: rgba(10,14,12,0.9); border: 1px solid #3a5a48; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; min-width: 180px; display: none;
    }
    @media (max-width: 720px) {
      #hud { max-width: min(58vw, 300px); padding: 9px 11px; }
      #hud h1 { font-size: 13px; }
      #hud p { font-size: 10px; }
      #controls { max-width: 42vw; padding: 7px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
      button { min-height: 38px; padding: 6px 7px; font-size: 10px; }
      #legend { max-height: 34vh; overflow: auto; padding: 8px 10px; font-size: 10px; }
      #info { max-width: 52vw; right: 10px; bottom: 10px; min-width: 0; }

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const mapData = JSON.parse(document.getElementById('barburhen-map-data').textContent);
    const mapPoints = mapData.points;
    const worldConfig = mapData.world;
    const typeCounts = mapPoints.reduce((counts, point) => {
      counts[point.type] = (counts[point.type] || 0) + 1;
      return counts;
    }, {});
    document.querySelectorAll('[data-count]').forEach(node => {
      node.textContent = typeCounts[node.dataset.count] || 0;
    });
    document.getElementById('map-status').textContent = `${mapPoints.length} pontos · ${worldConfig.maxPlayers} jogadores`;

    // --- Scale: game cm → meters (divide by 100). Origin = Park center ---
    const cm = (v) => v / 100;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x77786c);
    scene.fog = new THREE.FogExp2(0x8a806e, 0.0011);
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 8;
    skyCanvas.height = 256;
    const skyContext = skyCanvas.getContext('2d');
    const skyGradient = skyContext.createLinearGradient(0, 0, 0, skyCanvas.height);
    skyGradient.addColorStop(0, '#4f615f');
    skyGradient.addColorStop(0.46, '#8a8d7b');
    skyGradient.addColorStop(0.74, '#d39b69');
    skyGradient.addColorStop(1, '#655545');
    skyContext.fillStyle = skyGradient;
    skyContext.fillRect(0, 0, skyCanvas.width, skyCanvas.height);
    const skyTexture = new THREE.CanvasTexture(skyCanvas);
    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(900, 32, 16),
      new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false })
    );
    skyDome.renderOrder = -1;
    scene.add(skyDome);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 800);
    camera.position.set(180, 140, 220);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 20;
    controls.maxDistance = 500;
    controls.update();

    // Lights
    scene.add(new THREE.HemisphereLight(0xa3bdb1, 0x4c3a28, 2.0));
    const sun = new THREE.DirectionalLight(0xffd2a0, 3.2);
    sun.position.set(-120, 180, -90);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -280;
    sun.shadow.camera.right = 280;
    sun.shadow.camera.top = 280;
    sun.shadow.camera.bottom = -280;
    sun.shadow.bias = -0.0004;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x88b7bf, 0.8);
    fill.position.set(120, 60, 100);
    scene.add(fill);

    // Procedural, source-controlled ground grain; no downloaded texture dependency.
    function makeGroundTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 256;
      const context = canvas.getContext('2d');
      const image = context.createImageData(256, 256);
      let seed = 0x42b17;
      const random = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      for (let i = 0; i < image.data.length; i += 4) {
        const grain = Math.floor(random() * 36);
        image.data[i] = 102 + grain;
        image.data[i + 1] = 94 + grain;
        image.data[i + 2] = 72 + Math.floor(grain * 0.7);
        image.data[i + 3] = 255;
      }
      context.putImageData(image, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(22, 22);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
      return texture;
    }
    // Ground plane
    const groundMat = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), color: 0xc1b9a0, roughness: 0.96, metalness: 0.02 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid
    const grid = new THREE.GridHelper(500, 50, 0x2a3a30, 0x1a2820);
    grid.position.y = 0.05;
    grid.visible = false;
    scene.add(grid);

    function box(w, h, d, color, x, y, z, rotY = 0) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.1 })
      );
      m.position.set(x, y + h / 2, z);
      m.rotation.y = rotY;
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }

    // Sector dressing is deterministic and instanced so the preview stays responsive.
    function addRubbleCluster(centerX, centerZ, radius, count, seed, color) {
      const geometry = new THREE.DodecahedronGeometry(1, 0);
      const material = new THREE.MeshStandardMaterial({ color, roughness: 0.96, flatShading: true });
      const rubble = new THREE.InstancedMesh(geometry, material, count);
      rubble.castShadow = true;
      rubble.receiveShadow = true;
      let state = seed >>> 0;
      const random = () => ((state = (state * 1664525 + 1013904223) >>> 0) / 4294967296);
      const object = new THREE.Object3D();
      for (let i = 0; i < count; i++) {
        const angle = random() * Math.PI * 2;
        const distance = radius * Math.sqrt(random());
        object.position.set(centerX + Math.cos(angle) * distance, 0.25 + random() * 0.5, centerZ + Math.sin(angle) * distance);
        object.rotation.set(random() * 0.8, random() * Math.PI, random() * 0.8);
        const scale = 0.25 + random() * 1.15;
        object.scale.set(scale * (0.7 + random() * 0.8), scale * (0.35 + random() * 0.5), scale * (0.7 + random() * 0.9));
        object.updateMatrix();
        rubble.setMatrixAt(i, object.matrix);
      }
      rubble.instanceMatrix.needsUpdate = true;
      scene.add(rubble);
    }

    function branchBetween(start, end, thickness, material) {
      const delta = new THREE.Vector3().subVectors(end, start);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(thickness * 0.45, thickness, delta.length(), 5), material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.clone().normalize());
      mesh.castShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function deadTree(x, z, height, seed) {
      const bark = new THREE.MeshStandardMaterial({ color: 0x40392b, roughness: 1, flatShading: true });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.48, height, 7), bark);
      trunk.position.set(x, height / 2, z);
      trunk.rotation.z = ((seed % 5) - 2) * 0.025;
      trunk.castShadow = true;
      scene.add(trunk);
      const top = new THREE.Vector3(x, height, z);
      for (let i = 0; i < 3; i++) {
        const side = (i % 2 ? 1 : -1) * (1.2 + ((seed + i * 7) % 14) / 10);
        const start = new THREE.Vector3(x, height * (0.43 + i * 0.16), z);
        const end = new THREE.Vector3(x + side, height * (0.58 + i * 0.13), z + (i - 1) * 0.65);
        branchBetween(start, end, 0.2 - i * 0.035, bark);
      }
      branchBetween(top, new THREE.Vector3(x + (seed % 2 ? 1 : -1), height + 1.5, z - 0.5), 0.13, bark);
    }

    function addRoad(x, z, width, length, rotation = 0) {
      const road = box(width, 0.09, length, 0x262a28, x, 0.06, z, rotation);
      road.receiveShadow = true;
      for (let offset = -length / 2 + 9; offset < length / 2 - 4; offset += 14) {
        box(0.22, 0.035, 5.5, 0xb99a57, x + Math.sin(rotation) * offset, 0.16, z + Math.cos(rotation) * offset, rotation);
      }
    }

    function marker(color, x, z, y = 1.5, r = 1.2, name = '', data = {}) {
      const g = new THREE.Mesh(
        new THREE.SphereGeometry(r, 12, 12),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35 })
      );
      g.position.set(x, y, z);
      g.userData = { name, ...data };
      scene.add(g);
      // stem
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.15, y, 6),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      stem.position.set(x, y / 2, z);
      scene.add(stem);
      clickables.push(g);
      return g;
    }

    const clickables = [];

    // ========== SECTOR FLOORS (slight color tint) ==========
    function sectorFloor(w, d, color, x, z) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, d),
        new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, transparent: true, opacity: 0.35 })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, 0.08, z);
      scene.add(m);
    }
    // Industrial (south) Z positive in three = -Y game? 
    // Game: +Y north, +X east. Three: +Z south-ish for our mapping: gameY → -threeZ, gameX → threeX
    const gx = (xCm) => cm(xCm);
    const gz = (yCm) => -cm(yCm); // game +Y (north) → three -Z

    sectorFloor(280, 160, 0x3a3020, 0, gz(-14000));      // Industrial
    sectorFloor(160, 160, 0x204028, 0, 0);                 // Park
    sectorFloor(200, 180, 0x3a2818, gx(9000), gz(7000));  // Urban
    sectorFloor(180, 80, 0x1a3040, 0, gz(20000));          // Station

    // Dusty service roads and rubble fields establish sector identity without external assets.
    addRoad(0, gz(-14000), 16, 240, Math.PI / 2);
    addRoad(gx(9000), gz(7000), 12, 145, Math.PI / 2);
    addRoad(0, gz(20000), 12, 145, Math.PI / 2);
    addRubbleCluster(-102, gz(-14000), 24, 90, 4101, 0x514737);
    addRubbleCluster(74, gz(7000), 18, 58, 4102, 0x4b4038);
    addRubbleCluster(-58, gz(0), 16, 48, 4103, 0x3d4435);
    addRubbleCluster(20, gz(20000), 16, 54, 4104, 0x354149);

    // ========== INDUSTRIAL BUILDINGS ==========
    box(40, 12, 22, 0x3a3830, gx(-6000), 0, gz(-12000)); // Galpão A
    box(40, 12, 22, 0x3a3830, gx(2000), 0, gz(-12000));
    box(44, 14, 24, 0x3a3830, gx(6000), 0, gz(-11500));
    box(36, 10, 20, 0x353028, gx(10000), 0, gz(-13000));
    // Silos
    const siloGeo = new THREE.CylinderGeometry(8, 8, 28, 16);
    const siloMat = new THREE.MeshStandardMaterial({ color: 0x4a4840, metalness: 0.4, roughness: 0.5 });
    const silo1 = new THREE.Mesh(siloGeo, siloMat);
    silo1.position.set(gx(-6000), 14, gz(-9000));
    silo1.castShadow = true;
    scene.add(silo1);
    const silo2 = new THREE.Mesh(siloGeo, siloMat);
    silo2.position.set(gx(-4500), 12, gz(-9500));
    silo2.scale.y = 0.85;
    scene.add(silo2);
    // Crane
    box(2, 35, 2, 0x6a6050, gx(5000), 0, gz(-13000));
    box(30, 1.5, 2, 0x6a6050, gx(5000), 34, gz(-13000));
    // Water tower
    box(3, 25, 3, 0x4a4a40, gx(-10000), 0, gz(-8000));
    const tankTop = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 8, 12), siloMat);
    tankTop.position.set(gx(-10000), 28, gz(-8000));
    scene.add(tankTop);
    // Containers
    box(6, 3, 12, 0x3a5020, gx(8000), 0, gz(-15000));
    box(6, 3, 12, 0x503020, gx(8700), 0, gz(-15000));
    box(6, 3, 12, 0x303050, gx(8000), 3.2, gz(-15000));
    // Bunker Ind
    box(18, 5, 14, 0x404050, gx(-2000), 0, gz(-12000));
    // Police Ind
    box(12, 6, 10, 0x2a3550, gx(1000), 0, gz(-14000));

    // ========== PARK ==========
    // Coreto
    const coreto = new THREE.Mesh(
      new THREE.CylinderGeometry(8, 10, 2, 8),
      new THREE.MeshStandardMaterial({ color: 0x3a3028 })
    );
    coreto.position.set(0, 1, 0);
    scene.add(coreto);
    const pillars = [0, 1, 2, 3, 4, 5, 6, 7].map(i => {
      const a = (i / 8) * Math.PI * 2;
      return box(0.8, 6, 0.8, 0x4a4038, Math.cos(a) * 7, 0, Math.sin(a) * 7);
    });
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(11, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x2a2820 })
    );
    roof.position.set(0, 8, 0);
    scene.add(roof);
    // Dead trees use fixed seeds/positions so every review capture is reproducible.
    [[-40, -30, 17, 3], [45, -25, 14, 8], [-35, 40, 19, 5], [50, 35, 13, 2], [-20, 55, 16, 9], [30, -50, 18, 4], [-61, 9, 12, 7], [59, -6, 15, 1]].forEach(t => deadTree(t[0], t[1], t[2], t[3]));
    // Dry lake
    const lake = new THREE.Mesh(
      new THREE.CircleGeometry(18, 24),
      new THREE.MeshStandardMaterial({ color: 0x1a1810, roughness: 1 })
    );
    lake.rotation.x = -Math.PI / 2;
    lake.position.set(25, 0.1, 20);
    scene.add(lake);
    // Hospital park
    box(16, 8, 12, 0x4a2828, gx(-4000), 0, gz(-2500));

    // ========== URBAN ==========
    box(28, 18, 20, 0x3a3530, gx(12000), 0, gz(8000)); // tower
    box(22, 14, 18, 0x3a3028, gx(9000), 0, gz(11000));
    box(35, 10, 25, 0x2a2820, gx(10000), 0, gz(5000)); // hospital area
    box(20, 9, 14, 0x3a2820, gx(10000), 0, gz(5000)); // hospital
    box(14, 7, 12, 0x2a3550, gx(11000), 0, gz(3000)); // police 1
    box(14, 7, 12, 0x2a3550, gx(5000), 0, gz(10000)); // police 2
    box(22, 6, 16, 0x404050, gx(7000), 0, gz(9000)); // bunker urban
    box(40, 8, 30, 0x2a2520, gx(13000), 0, gz(4000)); // unfinished
    box(18, 5, 12, 0x2a2820, gx(7500), 0, gz(4000));
    // Building frames (unfinished)
    for (let i = 0; i < 4; i++) {
      box(1, 20, 1, 0x5a5040, gx(14000 + i * 3), 0, gz(5000));
      box(1, 20, 1, 0x5a5040, gx(14000 + i * 3), 0, gz(5500));
    }
    // Window bands and roof machinery turn flat blockout volumes into readable combat silhouettes.
    function facadeWindows(centerX, centerZ, width, depth, floors, columns, tint = 0x90a39a) {
      for (let floor = 0; floor < floors; floor++) {
        for (let column = 0; column < columns; column++) {
          const x = centerX - width / 2 + (column + 0.5) * width / columns;
          const y = 2.2 + floor * 3.5;
          box(width / columns * 0.52, 1.25, 0.16, tint, x, y, centerZ + depth / 2 + 0.12);
        }
      }
    }
    facadeWindows(gx(12000), gz(8000), 24, 20, 4, 5, 0x86958d);
    facadeWindows(gx(9000), gz(11000), 18, 18, 3, 4, 0x8b7661);
    box(5, 1.2, 4, 0x62624e, gx(12000), 18.2, gz(8000)); // rooftop HVAC
    box(3.5, 0.8, 3, 0xb17b3e, gx(9500), 14.1, gz(11000)); // broken roof beacon

    // ========== STATION ==========
    box(80, 1, 4, 0x3a4048, 0, 0, gz(20000)); // rails
    box(80, 1, 4, 0x3a4048, 0, 0, gz(19800));
    box(16, 8, 12, 0x2a3540, gx(-4000), 0, gz(20500)); // ticket
    box(20, 16, 14, 0x2a3540, 0, 0, gz(21000)); // control tower
    box(18, 7, 12, 0x2a3038, gx(5000), 0, gz(20500)); // depot

    // ========== RING — dimensions and center from the official world CSV ==========
    const ringCenterX = gx(worldConfig.parkCenterXcm);
    const ringCenterZ = gz(worldConfig.parkCenterYcm);
    const ringStartRadius = cm(worldConfig.ringStartRadiusCm);
    const ringEndRadius = cm(worldConfig.ringEndRadiusCm);
    const ringGroup = new THREE.Group();
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x50a060, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
    const ringStart = new THREE.Mesh(new THREE.RingGeometry(ringStartRadius - 2, ringStartRadius + 2, 96), ringMat);
    ringStart.rotation.x = -Math.PI / 2;
    ringStart.position.set(ringCenterX, 0.5, ringCenterZ);
    ringGroup.add(ringStart);
    const ringEndMat = new THREE.MeshBasicMaterial({ color: 0xc04040, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
    const ringEnd = new THREE.Mesh(new THREE.RingGeometry(ringEndRadius - 2, ringEndRadius + 2, 64), ringEndMat);
    ringEnd.rotation.x = -Math.PI / 2;
    ringEnd.position.set(ringCenterX, 0.6, ringCenterZ);
    ringGroup.add(ringEnd);
    // Vertical wall hint for end ring
    const wall = new THREE.Mesh(
      new THREE.CylinderGeometry(ringEndRadius, ringEndRadius, 8, 64, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xc04040, transparent: true, opacity: 0.15, side: THREE.DoubleSide })
    );
    wall.position.set(ringCenterX, 4, ringCenterZ);
    ringGroup.add(wall);
    scene.add(ringGroup);

    // ========== ACID RAIN particles ==========
    let rainActive = true;
    const rainCount = 1800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(rainCount * 3);
    let rainSeed = 0x5a17;
    const rainRandom = () => ((rainSeed = (rainSeed * 1664525 + 1013904223) >>> 0) / 4294967296);
    for (let i = 0; i < rainCount; i++) {
      rainPos[i * 3] = (rainRandom() - 0.5) * 400;
      rainPos[i * 3 + 1] = rainRandom() * 80;
      rainPos[i * 3 + 2] = (rainRandom() - 0.5) * 400;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({ color: 0x60a070, size: 0.35, transparent: true, opacity: 0.5 });
    const rain = new THREE.Points(rainGeo, rainMat);
    scene.add(rain);

    // ========== MARKERS — all 49 records come from the official CSV ==========
    const markerStyle = {
      PlayerSpawn: { color: 0x30c040, radius: 1.5, label: 'Spawn' },
      ZEXTerminal: { color: 0x2080ff, radius: 1.35, label: 'Terminal ZEX' },
      SniperPoint: { color: 0xe09020, radius: 1.1, label: 'Ponto elevado' },
      TankSpawn: { color: 0x608050, radius: 1.4, label: 'Tanque' },
      Bunker: { color: 0x77778f, radius: 1.35, label: 'Bunker' },
      Hospital: { color: 0xc05a50, radius: 1.35, label: 'Hospital' },
      PoliceStation: { color: 0x5077b0, radius: 1.35, label: 'Delegacia' },
      LootCache: { color: 0xd0b45e, radius: 1.15, label: 'Cache de loot' },
      RingCenter: { color: 0xd34b46, radius: 1.5, label: 'Centro do anel' }
    };
    for (const point of mapPoints) {
      const style = markerStyle[point.type];
      if (!style) continue;
      const x = gx(point.xCm);
      const z = gz(point.yCm);
      const y = Math.max(1.5, cm(point.zCm) + 1.5);
      if (point.type === 'TankSpawn') {
        const hull = box(7.2, 2.4, 10.5, 0x394536, x, 0, z, THREE.MathUtils.degToRad(point.yaw));
        const turret = box(3.2, 1.0, 3.4, 0x596349, x, 2.35, z, THREE.MathUtils.degToRad(point.yaw));
        hull.userData = { name: point.name, type: style.label, sector: point.sector, id: point.id };
        turret.userData = hull.userData;
        clickables.push(hull, turret);
        continue;
      }
      marker(style.color, x, z, y, style.radius, point.name, {
        id: point.id,
        type: style.label,
        dataType: point.type,
        sector: point.sector,
        radiusMeters: cm(point.radiusCm)
      });
    }

    // Labels sector
    function makeLabel(text, x, z, color = '#c8d0b0') {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, 512, 64);
      ctx.font = 'bold 28px system-ui';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(text, 256, 42);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const spr = new THREE.Sprite(mat);
      spr.position.set(x, 25, z);
      spr.scale.set(40, 5, 1);
      scene.add(spr);
    }
    makeLabel('INDUSTRIAL — SPAWNS', 0, gz(-14000), '#d0a050');
    makeLabel('PARQUE — FIM DO ANEL', 0, 0, '#60c080');
    makeLabel('URBANO', gx(9000), gz(7000), '#d08050');
    makeLabel('ESTAÇÃO — EXTRAÇÃO', 0, gz(20000), '#50b0d0');

    // Click raycast
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const infoEl = document.getElementById('info');
    renderer.domElement.addEventListener('click', (e) => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(clickables, false);
      if (hits.length) {
        const u = hits[0].object.userData;
        infoEl.replaceChildren();
        const title = document.createElement('strong');
        title.textContent = u.name || 'POI';
        const details = document.createElement('div');
        details.textContent = [u.type, u.sector, u.radiusMeters ? `raio ${u.radiusMeters.toFixed(1)} m` : ''].filter(Boolean).join(' · ');
        infoEl.append(title, details);
        infoEl.style.display = 'block';
      } else {
        infoEl.style.display = 'none';
      }
    });

    // UI buttons
    document.getElementById('btn-ring').onclick = () => { ringGroup.visible = !ringGroup.visible; };
    document.getElementById('btn-rain').onclick = () => { rainActive = !rainActive; rain.visible = rainActive; };
    document.getElementById('btn-top').onclick = () => {
      camera.position.set(0, 320, 0.1);
      controls.target.set(0, 0, 0);
      controls.update();
    };
    document.getElementById('btn-iso').onclick = () => {
      camera.position.set(180, 140, 220);
      controls.target.set(0, 0, 0);
      controls.update();
    };
    document.getElementById('btn-grid').onclick = () => { grid.visible = !grid.visible; };

    // Animate at a bounded delta time for consistent behavior on slow devices.
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const deltaSeconds = Math.min(clock.getDelta(), 0.05);
      if (rainActive) {
        const pos = rain.geometry.attributes.position.array;
        for (let i = 0; i < rainCount; i++) {
          pos[i * 3 + 1] -= 24 * deltaSeconds;
          if (pos[i * 3 + 1] < 0) pos[i * 3 + 1] = 80;
        }
        rain.geometry.attributes.position.needsUpdate = true;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
