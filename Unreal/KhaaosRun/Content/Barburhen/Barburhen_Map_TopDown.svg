<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      .title { fill: #f0e6d0; font-family: Georgia, serif; font-size: 28px; font-weight: bold; }
      .sub { fill: #a09070; font-family: sans-serif; font-size: 12px; }
      .label { fill: #e8e0d0; font-family: sans-serif; font-size: 11px; font-weight: bold; }
      .small { fill: #c0b8a0; font-family: sans-serif; font-size: 9px; }
      .legend { fill: #d0c8b0; font-family: sans-serif; font-size: 10px; }
    </style>
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a4a3a;stop-opacity:0.3"/>
      <stop offset="70%" style="stop-color:#1a3028;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0a1510;stop-opacity:0.8"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#0d1210"/>
  <rect x="20" y="20" width="960" height="960" fill="#141a16" stroke="#3a5040" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="48" text-anchor="middle" class="title">BARBURHEN — W1/C1</text>
  <text x="500" y="68" text-anchor="middle" class="sub">Mundo da Destruição · Água da Morte · 100 players · Anel 10 min</text>

  <!-- Coordinate system: center = Park (0,0) at SVG (500, 520)
       Scale: 25000 cm = 250m ≈ 350 px radius for outer ring
       Y game north = SVG up (decrease Y)
  -->

  <!-- Outer ring start (r=250m) -->
  <circle cx="500" cy="520" r="350" fill="none" stroke="#4a6a50" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  <text x="500" y="155" text-anchor="middle" class="small">Anel inicial Ø 500 m</text>

  <!-- End ring (r=40m) -->
  <circle cx="500" cy="520" r="56" fill="none" stroke="#c04040" stroke-width="2.5"/>
  <text x="500" y="528" text-anchor="middle" class="small" fill="#e06060">END</text>

  <!-- SECTOR: Extraction Station (North) -->
  <rect x="320" y="100" width="360" height="120" fill="#1a2830" stroke="#4080a0" stroke-width="2" rx="4"/>
  <text x="500" y="130" text-anchor="middle" class="label" fill="#60b0d0">ESTAÇÃO FERROVIÁRIA</text>
  <text x="500" y="148" text-anchor="middle" class="small">Zona de Extração Final</text>
  <!-- ZEX 13-15 -->
  <circle cx="500" cy="175" r="8" fill="#2080ff"/><text x="512" y="179" class="small">ZEX13</text>
  <circle cx="430" cy="185" r="7" fill="#2080ff"/><text x="442" y="189" class="small">ZEX14</text>
  <circle cx="570" cy="185" r="7" fill="#2080ff"/><text x="582" y="189" class="small">ZEX15</text>
  <!-- Snipers station -->
  <rect x="450" y="105" width="10" height="10" fill="#e0a020"/>
  <rect x="580" y="110" width="10" height="10" fill="#e0a020"/>
  <!-- Tank -->
  <rect x="560" y="160" width="14" height="10" fill="#608050" rx="2"/>

  <!-- SECTOR: Urban Commercial (NE) -->
  <rect x="580" y="240" width="320" height="280" fill="#1e1a18" stroke="#a07050" stroke-width="2" rx="4"/>
  <text x="740" y="265" text-anchor="middle" class="label" fill="#d09060">ÁREA URBANA (2/8)</text>
  <text x="740" y="280" text-anchor="middle" class="small">Comercial · Emboscadas</text>
  <!-- Bunker urban -->
  <rect x="680" y="380" width="24" height="18" fill="#505060" stroke="#808090"/>
  <text x="680" y="415" class="small">Bunker</text>
  <!-- Hospital -->
  <rect x="780" y="320" width="28" height="20" fill="#804040"/>
  <text x="778" y="355" class="small">Hospital</text>
  <!-- Police -->
  <rect x="800" y="420" width="20" height="16" fill="#405080"/>
  <rect x="620" y="300" width="20" height="16" fill="#405080"/>
  <text x="800" y="452" class="small">Delegacias</text>
  <!-- Snipers -->
  <rect x="850" y="280" width="10" height="10" fill="#e0a020"/>
  <rect x="780" y="250" width="10" height="10" fill="#e0a020"/>
  <rect x="880" y="350" width="10" height="10" fill="#e0a020"/>
  <rect x="650" y="260" width="10" height="10" fill="#e0a020"/>
  <!-- ZEX urban -->
  <circle cx="720" cy="360" r="7" fill="#2080ff"/>
  <circle cx="820" cy="300" r="7" fill="#2080ff"/>
  <circle cx="640" cy="340" r="7" fill="#2080ff"/>
  <circle cx="760" cy="280" r="7" fill="#2080ff"/>
  <!-- Tank -->
  <rect x="750" y="400" width="14" height="10" fill="#608050" rx="2"/>

  <!-- SECTOR: Park (Center) -->
  <rect x="340" y="300" width="220" height="220" fill="#1a2818" stroke="#50a060" stroke-width="2" rx="4"/>
  <text x="450" y="325" text-anchor="middle" class="label" fill="#70c080">PARQUE (3/8)</text>
  <text x="450" y="340" text-anchor="middle" class="small">Centro · Anel fecha aqui</text>
  <!-- Park ZEX -->
  <circle cx="490" cy="400" r="7" fill="#2080ff"/>
  <circle cx="410" cy="390" r="7" fill="#2080ff"/>
  <circle cx="450" cy="460" r="7" fill="#2080ff"/>
  <circle cx="510" cy="440" r="7" fill="#2080ff"/>
  <!-- Hospital park -->
  <rect x="360" y="450" width="24" height="18" fill="#804040"/>
  <text x="358" y="485" class="small">Hospital</text>
  <!-- Sniper mirante -->
  <rect x="445" y="310" width="10" height="10" fill="#e0a020"/>
  <!-- Tank park -->
  <rect x="400" cy="420" width="14" height="10" fill="#608050" rx="2" x="400" y="420"/>
  <!-- Coreto / center mark -->
  <circle cx="450" cy="410" r="12" fill="none" stroke="#c04040" stroke-width="2"/>
  <text x="450" y="414" text-anchor="middle" class="small" fill="#e06060">●</text>

  <!-- SECTOR: Industrial (South) -->
  <rect x="200" y="560" width="600" height="280" fill="#1a1814" stroke="#a08040" stroke-width="2" rx="4"/>
  <text x="500" y="585" text-anchor="middle" class="label" fill="#d0a050">SETOR INDUSTRIAL (3/8)</text>
  <text x="500" y="600" text-anchor="middle" class="small">Desembarque · SPAWNS · Galpões · Silos</text>
  <!-- Spawns -->
  <circle cx="500" cy="780" r="9" fill="#40c040" stroke="#80ff80" stroke-width="1"/>
  <circle cx="560" cy="760" r="9" fill="#40c040"/>
  <circle cx="440" cy="760" r="9" fill="#40c040"/>
  <circle cx="620" cy="740" r="9" fill="#40c040"/>
  <circle cx="380" cy="740" r="9" fill="#40c040"/>
  <circle cx="680" cy="720" r="9" fill="#40c040"/>
  <circle cx="320" cy="720" r="9" fill="#40c040"/>
  <circle cx="520" cy="810" r="9" fill="#40c040"/>
  <text x="500" y="835" text-anchor="middle" class="small" fill="#60e060">▲ Player Spawns</text>
  <!-- Bunker ind -->
  <rect x="460" y="650" width="24" height="18" fill="#505060" stroke="#808090"/>
  <text x="455" y="685" class="small">Bunker</text>
  <!-- Police ind -->
  <rect x="520" y="700" width="20" height="16" fill="#405080"/>
  <!-- Snipers industrial -->
  <rect x="300" y="620" width="10" height="10" fill="#e0a020"/>
  <rect x="600" y="640" width="10" height="10" fill="#e0a020"/>
  <rect x="250" y="680" width="10" height="10" fill="#e0a020"/>
  <!-- Tanks -->
  <rect x="550" y="660" width="14" height="10" fill="#608050" rx="2"/>
  <rect x="380" y="670" width="14" height="10" fill="#608050" rx="2"/>
  <!-- ZEX industrial -->
  <circle cx="500" cy="700" r="7" fill="#2080ff"/>
  <circle cx="600" cy="680" r="7" fill="#2080ff"/>
  <circle cx="400" cy="680" r="7" fill="#2080ff"/>
  <circle cx="520" cy="630" r="7" fill="#2080ff"/>

  <!-- Legend -->
  <rect x="40" y="860" width="920" height="100" fill="#121610" stroke="#3a5040" stroke-width="1" rx="4"/>
  <text x="60" y="880" class="legend" font-weight="bold">LEGENDA</text>
  <circle cx="70" cy="900" r="6" fill="#40c040"/><text x="82" y="904" class="legend">Spawn</text>
  <circle cx="150" cy="900" r="6" fill="#2080ff"/><text x="162" y="904" class="legend">ZEX (15)</text>
  <rect x="230" y="894" width="10" height="10" fill="#e0a020"/><text x="246" y="904" class="legend">Sniper (10)</text>
  <rect x="340" y="894" width="14" height="10" fill="#608050" rx="2"/><text x="360" y="904" class="legend">Tanque (5)</text>
  <rect x="440" y="894" width="14" height="10" fill="#505060"/><text x="460" y="904" class="legend">Bunker (2)</text>
  <rect x="540" y="894" width="14" height="10" fill="#804040"/><text x="560" y="904" class="legend">Hospital (2)</text>
  <rect x="650" y="894" width="14" height="10" fill="#405080"/><text x="670" y="904" class="legend">Delegacia (3)</text>
  <circle cx="780" cy="900" r="8" fill="none" stroke="#c04040" stroke-width="2"/><text x="794" y="904" class="legend">Anel final</text>
  <text x="60" y="930" class="legend">Escala: centro = Parque (0,0,0) · Anel inicial 25.000 cm · Fecha em 600 s · Chuva ácida −1%/10s</text>
  <text x="60" y="948" class="legend">Dados: DT_Barburhen_MapPoints.csv · Sistemas: RingController + AcidRain + MapBuilder + SectorVolume</text>

  <!-- Compass -->
  <text x="920" y="90" text-anchor="middle" class="label" fill="#80a090">N</text>
  <text x="920" y="105" text-anchor="middle" class="small">↑</text>
</svg>
