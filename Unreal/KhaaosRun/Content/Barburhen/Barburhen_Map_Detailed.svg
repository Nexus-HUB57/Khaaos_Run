  <rect x="870" y="355" width="55" height="40" fill="#2a2420" stroke="#4a4038"/><text x="875" y="378" class="xs">Torre A</text>
  <rect x="980" y="350" width="60" height="45" fill="#252018" stroke="#4a4038"/><text x="985" y="375" class="xs">Inacabado</text>
  <rect x="760" y="420" width="50" height="30" fill="#2a2420" stroke="#4a4038"/><text x="762" y="440" class="xs">Farmácia</text>
  <rect x="870" y="420" width="80" height="35" fill="#2a1a18" stroke="#5a3030"/><text x="880" y="442" class="xs">HOSPITAL-1</text>
  <rect x="980" y="430" width="45" height="28" fill="#1a2030" stroke="#3050a0"/><text x="982" y="448" class="xs">Deleg-1</text>
  <rect x="760" y="520" width="55" height="30" fill="#1a2030" stroke="#3050a0"/><text x="762" y="540" class="xs">Deleg-2</text>
  <rect x="870" y="530" width="40" height="25" fill="#2a2420" stroke="#4a4038"/><text x="872" y="547" class="xs">Loja</text>
  <rect x="940" y="520" width="65" height="40" fill="#303038" stroke="#606070"/><text x="950" y="545" class="xs">BUNKER-U</text>
