  <rect x="560" y="130" width="80" height="35" fill="#2a3540" stroke="#4a6070"/><text x="570" y="152" class="xs">Torre Controle</text>
  <rect x="700" y="165" width="55" height="25" fill="#2a3540" stroke="#4a6070"/><text x="705" y="182" class="xs">Depósito</text>
  
  <!-- ZEX station -->
  <circle cx="600" cy="240" r="9" fill="#1a60ff" stroke="#80c0ff" stroke-width="1.5"/><text x="612" y="244" class="sm" fill="#60a0ff">ZEX-13 EXTRAÇÃO</text>
  <circle cx="520" cy="255" r="7" fill="#2080ff"/><text x="530" y="259" class="xs">ZEX-14</text>
  <circle cx="680" cy="255" r="7" fill="#2080ff"/><text x="690" y="259" class="xs">ZEX-15</text>
