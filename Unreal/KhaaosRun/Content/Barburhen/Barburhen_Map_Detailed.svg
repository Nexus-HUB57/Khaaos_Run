  <text x="70" y="1235" class="lb">LEGENDA COMPLETA</text>
  
  <circle cx="80" cy="1260" r="7" fill="#30a030" stroke="#80ff80"/><text x="95" y="1264" class="lg">Spawn (8)</text>
  <circle cx="180" cy="1260" r="7" fill="#2080ff"/><text x="195" y="1264" class="lg">ZEX (15)</text>
