<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <defs>
    <style>
      .t1{fill:#f5ecd8;font-family:Georgia,serif;font-size:32px;font-weight:bold}
      .t2{fill:#a89878;font-family:sans-serif;font-size:13px}
      .lb{fill:#e8e0d0;font-family:sans-serif;font-size:11px;font-weight:bold}
      .sm{fill:#b0a890;font-family:sans-serif;font-size:9px}
      .xs{fill:#908870;font-family:sans-serif;font-size:8px}
      .lg{fill:#c8c0a8;font-family:sans-serif;font-size:10px}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a221c" stroke-width="0.5"/>
    </pattern>
    <pattern id="rubble" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#2a2820" opacity="0.5"/>
      <circle cx="8" cy="9" r="1.2" fill="#2a2820" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="1400" fill="#0a0e0c"/>
  <rect x="30" y="30" width="1140" height="1340" fill="#101612" stroke="#3a4a40" stroke-width="2"/>
  <rect x="50" y="90" width="1100" height="1100" fill="url(#grid)" stroke="#2a3a30" stroke-width="1"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" class="t1">BARBURHEN — MAPA COMPLETO DETALHADO</text>
  <text x="600" y="75" text-anchor="middle" class="t2">W1/C1 Mundo da Destruição · Escala 1px ≈ 50cm · Origem (0,0) = Centro do Parque · Anel Água da Morte</text>

  <!-- ========== RING RINGS ========== -->
  <!-- Center at SVG 600, 700 = game 0,0 -->
  <!-- Scale: 1000cm game = 14px approx → 25000cm = 350px -->
  <circle cx="600" cy="700" r="350" fill="none" stroke="#3a5a48" stroke-width="2" stroke-dasharray="10,6" opacity="0.9"/>
  <circle cx="600" cy="700" r="280" fill="none" stroke="#4a6a50" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="600" cy="700" r="200" fill="none" stroke="#5a7a58" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
  <circle cx="600" cy="700" r="120" fill="none" stroke="#6a8a60" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <circle cx="600" cy="700" r="56" fill="none" stroke="#c04040" stroke-width="3"/>
  <text x="600" y="340" text-anchor="middle" class="xs" fill="#5a7a68">Anel t=0 · Ø500m</text>
  <text x="600" y="695" text-anchor="middle" class="xs" fill="#e06060">ANEL FINAL Ø80m</text>

