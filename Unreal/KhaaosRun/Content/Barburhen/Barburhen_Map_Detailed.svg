  <text x="600" y="145" text-anchor="middle" class="lb" fill="#50a0c0">══ ESTAÇÃO FERROVIÁRIA (EXTRAÇÃO) ══</text>
  <text x="600" y="162" text-anchor="middle" class="sm">Heliporto / Plataformas / Trilhos destruídos · Extração final do ring</text>
  
  <!-- Rails -->
  <line x1="400" y1="200" x2="800" y2="200" stroke="#4a5560" stroke-width="3"/>
  <line x1="400" y1="210" x2="800" y2="210" stroke="#4a5560" stroke-width="3"/>
  <line x1="420" y1="190" x2="420" y2="220" stroke="#3a4550" stroke-width="2"/>
