  <circle cx="360" cy="970" r="10" fill="#30a030" stroke="#60c060"/>
  <circle cx="840" cy="970" r="10" fill="#30a030" stroke="#60c060"/>
  <circle cx="600" cy="1045" r="10" fill="#30a030" stroke="#60c060"/>
  <text x="600" y="1075" text-anchor="middle" class="sm" fill="#50c050">8 PlayerStarts · drop industrial</text>
  
