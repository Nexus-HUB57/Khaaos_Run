  <text x="70" y="1315" class="lg">PLUS −: chuva ácida · cães raivosos · ratos dedo-duro · desabamentos · corpos que apodrecem | PLUS +: bunkers · tanques · snipers · hospitais · delegacias</text>
  <text x="70" y="1335" class="lg">DADOS: DT_Barburhen_MapPoints.csv (todas coords em cm) · C++: RingController · AcidRain · MapBuilder · SectorVolume · ZEX · Bankhaoos · Transfer 20%</text>

