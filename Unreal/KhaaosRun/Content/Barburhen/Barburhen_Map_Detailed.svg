  <rect x="650" y="795" width="110" height="60" fill="#2a2818" stroke="#5a5040"/><text x="675" y="830" class="xs">Galpão C</text>
  <rect x="850" y="810" width="90" height="50" fill="#2a2818" stroke="#5a5040"/><text x="865" y="840" class="xs">Depósito</text>
  
