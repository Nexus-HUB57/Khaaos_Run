; DefaultGame.ini — Match settings, zone timing, loot tables, economy endpoints

[Script/KhaaosRun.KhaaosGameMode]
; ─── Match Settings ───────────────────────────────────────────────────────────
MaxPlayers=50
MinPlayersToStart=2
CountdownDuration=10.0
MatchTimeLimit=0.0
ZoneTickInterval=1.0

[Script/KhaaosRun.KhaaosSafeZone]
; ─── Zone Timing (from schema.ts ZONE_PHASES) ─────────────────────────────────
; Phase 1: 75% radius, 30s wait, 15s shrink,  5 dmg/tick
; Phase 2: 55% radius, 25s wait, 12s shrink, 10 dmg/tick
; Phase 3: 35% radius, 20s wait, 10s shrink, 18 dmg/tick
; Phase 4: 18% radius, 15s wait,  8s shrink, 28 dmg/tick
; Phase 5:  5% radius, 10s wait,  6s shrink, 45 dmg/tick
MapSize=10000.0
DamageTickInterval=1.0

[Script/KhaaosRun.KhaaosLootPickup]
; ─── Loot Settings ────────────────────────────────────────────────────────────
DefaultPickupRange=5.0

[Script/KhaaosRun.USpatialGridSubsystem]
; ─── Spatial Grid ─────────────────────────────────────────────────────────────
; Cell size in map % (15 from TS SpatialGrid — good for BR interest + PvP range)
CellSize=15.0

[Script/KhaaosRun.UEconomyBridgeSubsystem]
; ─── Economy API Bridge ───────────────────────────────────────────────────────
ApiBaseUrl=http://localhost:3000
PriceCacheTtl=300.0
MaxConcurrentRequests=4
RequestTimeout=10.0

; Economy config (from EconomyEngine.ts EconomyConfig)
BurnRateOnPurchase=0.35
SupplyPressureFactor=40.0
LoanDailyInterest=0.04
MaxOpenLoans=2

[Script/KhaaosRun.AKhaaosAIController]
; ─── AI Difficulty Defaults ───────────────────────────────────────────────────
ReactionTime=0.5
AimAccuracy=0.7
AggressionFactor=0.5
RetreatHealthThreshold=0.25
MaxEngageDistance=50.0

[Script/KhaaosRun.UKhaaosSaveGame]
; ─── Save Settings ────────────────────────────────────────────────────────────
MaxMatchHistory=50

[/Script/Engine.GameSession]
; ─── Session Settings ─────────────────────────────────────────────────────────
MaxPlayers=50

[/Script/UnrealEd.ProjectPackagingSettings]
; ─── Packaging ────────────────────────────────────────────────────────────────
bCompressed=True
bSharedCookBuild=False

