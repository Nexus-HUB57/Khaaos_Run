# Khaaos Run — Prometheus Configuration
# Production scrape config for UE5 Dedicated Server + Node.js Economy API + Infrastructure
# Fase 3: Monitoring stack

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'khaaos-run'
    environment: 'production'

# ─── Alertmanager Integration ──────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s

# ─── Rule Files ────────────────────────────────────────────────
rule_files:
  - '/etc/prometheus/alerts/*.yml'
  - '../infra/alerting/khaaos-alerts.yml'

# ─── Scrape Configs ───────────────────────────────────────────
scrape_configs:
  # ── UE5 Dedicated Server Metrics ─────────────────────────────
  - job_name: 'khaaos-dedicated-server'
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets:
          - 'khaaos-server:9090'
        labels:
          service: 'ue5-dedicated'
          component: 'game-server'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'khaaos_.*'
        action: keep

  # ── Node.js Economy API ──────────────────────────────────────
  - job_name: 'khaaos-economy-api'
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets:
          - 'economy-api:5000'
        labels:
          service: 'economy-api'
          component: 'economy'

  # ── Prometheus Self-Monitoring ────────────────────────────────
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'localhost:9090'

  # ── Node Exporter (Host Metrics) ─────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          component: 'host'

  # ── Redis ────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis:6379'
        labels:
          component: 'cache'
    # Redis exporter typically runs on 9121
    # This is the redis instance; use redis_exporter separately

  # ── PostgreSQL ───────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          component: 'database'

  # ── Grafana ──────────────────────────────────────────────────
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'
        labels:
          component: 'monitoring'

  # ── Pushgateway (for batch/stress test metrics) ──────────────
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets:
          - 'pushgateway:9091'
        labels:
          component: 'metrics-ingest'

  # ── Multi-Region Federation (Fase 5) ─────────────────────────
  # Pull metrics from other regions for cross-region dashboards
  - job_name: 'federation-na1'
    scrape_interval: 60s
    metrics_path: '/federate'
    params:
      'match[]':
        - '{job="khaaos-dedicated-server"}'
        - '{job="khaaos-economy-api"}'
    static_configs:
      - targets:
          - 'prometheus-na1.khaaos.run:9090'
        labels:
          region: 'na1'
          federation: 'true'

  - job_name: 'federation-eu1'
    scrape_interval: 60s
    metrics_path: '/federate'
    params:
      'match[]':
        - '{job="khaaos-dedicated-server"}'
        - '{job="khaaos-economy-api"}'
    static_configs:
      - targets:
          - 'prometheus-eu1.khaaos.run:9090'
        labels:
          region: 'eu1'
          federation: 'true'
