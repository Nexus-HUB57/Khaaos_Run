# =============================================================================
# Khaaos Run — Prometheus STAGING (M3: staging SRE)
# =============================================================================
# Alvo: stack `infra/staging/docker-compose.yml` com 2 réplicas de app,
# Redis master + réplica, PostgreSQL. Diferenças da config de produção:
#   - scrape dos 2 nós de aplicação (khaaos_runtime_* do game-runtime);
#   - job khaaos-app (server raiz TS com khaaos_http/ws/db) nos nós staging;
#   - regras de SLO + burn-rate carregadas de /etc/prometheus/rules.
#
# Uso: monte este arquivo + rules/ no container do Prometheus de staging:
#   docker run -d -p 9090:9090 \
#     -v monitoring/prometheus/prometheus-staging.yml:/etc/prometheus/prometheus.yml \
#     -v monitoring/prometheus/rules:/etc/prometheus/rules:ro \
#     prom/prometheus:latest
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'khaaos-run'
    environment: 'staging'

rule_files:
  - '/etc/prometheus/rules/khaaos-slo-recording-rules.yml'
  - '/etc/prometheus/rules/khaaos-slo-alerts.yml'

scrape_configs:
  # ── Nós de aplicação game-runtime (staging: app-1/app-2 do compose) ──
  # `docker compose up -d --scale app=2` gera app-1/app-2 na rede interna.
  - job_name: 'khaaos-runtime-staging'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app-1:8787']
        labels:
          service: 'game-runtime'
          node: 'staging-1'
          component: 'app'
      - targets: ['app-2:8787']
        labels:
          service: 'game-runtime'
          node: 'staging-2'
          component: 'app'

  # ── Servidor raiz TS (dist/index.cjs — cadeia mesh/gateway/2PC) ──
  # Mesmo endpoint /metrics (module server/game/metrics.ts).
  - job_name: 'khaaos-app-staging'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app-1:8787', 'app-2:8787']
        labels:
          service: 'khaaos-app'
          component: 'realtime'

  # ── Prometheus self ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Redis (master + réplica via redis_exporter, se provisionado) ──
  # Exporter único com duas targets: param target=redis://redis:6379 etc.
  - job_name: 'redis-staging'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          component: 'cache'

  # ── PostgreSQL (postgres_exporter) ──
  - job_name: 'postgres-staging'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          component: 'database'

  # ── Host ──
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'host'
