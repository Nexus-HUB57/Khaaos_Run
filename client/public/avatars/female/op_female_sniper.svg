    <path d="M471 92 L471 41 L420 41" stroke="#FB923C" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M41 420 L41 471 L92 471" stroke="#FB923C" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M471 420 L471 471 L420 471" stroke="#FB923C" stroke-width="7" fill="none" stroke-linecap="round"/>

