<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background glow gradient -->
    <radialGradient id="bgGlow-OP_MALE_VANGUARD" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#050508" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Skin gradient with realistic ambient occlusion -->
    <linearGradient id="skinGrad-OP_MALE_VANGUARD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d5524"/>
      <stop offset="100%" stop-color="#8d5524cc"/>
    </linearGradient>

    <!-- Tactical armor chest gradient -->
