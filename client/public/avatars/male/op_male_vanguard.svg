    <line x1="0" y1="256" x2="512" y2="256" stroke="#F97316" stroke-width="1.5" opacity="0.2"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#F97316" stroke-width="1.5" opacity="0.2"/>

