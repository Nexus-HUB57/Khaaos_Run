services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khaaos_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test_pw
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d khaaos_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Test data is disposable. There is intentionally no named volume.
    tmpfs:
      - /var/lib/postgresql/data

  # Redis para os testes reais do game-runtime (KR_REDIS_TEST_URL).
  # Test data is disposable. There is intentionally no named volume.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    command: ["redis-server", "--save", "", "--appendonly", "no"]
