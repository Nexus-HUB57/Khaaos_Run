# ==============================================================================
# KHAAOS RUN — UE5.8 Headless Compile & GPU Runner Registration
# Dispara em push para branches feat/* e main.
# Usa self-hosted GPU runner para compilação com -NullRHI -unattended.
# ==============================================================================

name: UE5 Headless Compile & GPU Runner

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'Unreal/KhaaosRun/Source/**'
      - 'Unreal/KhaaosRun/KhaaosRun.uproject'
  workflow_dispatch:
    inputs:
      ue5_install_dir:
        description: 'UE5_INSTALL_DIR path (e.g. /opt/unreal-engine/5.8)'
        required: false
        default: ''
      configuration:
        description: 'Build configuration (Development|Shipping)'
        required: false
        default: 'Development'

env:
  UE5_PROJECT: 'Unreal/KhaaosRun/KhaaosRun.uproject'
  BUILD_CONFIGURATION: ${{ github.event.inputs.configuration || 'Development' }}

jobs:
  # ─── Job 1: Register GPU Runner ───────────────────────────────────────────
  register-gpu-runner:
    name: Register GPU Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GPU Runner Availability
        run: |
          echo "🔍 Verificando disponibilidade do GPU runner..."
          # O runner 'self-hosted-gpu' deve estar registrado no repo settings.
          # Se não disponível, o job de compilação será skipado.
          RUNNER_LABEL="self-hosted-gpu"
          echo "RUNNER_LABEL=$RUNNER_LABEL" >> $GITHUB_ENV
          echo "✅ Runner label definido: $RUNNER_LABEL"

      - name: Set UE5_INSTALL_DIR
        run: |
          # Prioridade: workflow input > repository secret > default path
          if [ -n "${{ github.event.inputs.ue5_install_dir }}" ]; then
            UE5_DIR="${{ github.event.inputs.ue5_install_dir }}"
          elif [ -n "${{ secrets.UE5_INSTALL_DIR }}" ]; then
            UE5_DIR="${{ secrets.UE5_INSTALL_DIR }}"
          else
            UE5_DIR="/opt/unreal-engine/5.8"
          fi
          echo "UE5_INSTALL_DIR=$UE5_DIR" >> $GITHUB_ENV
          echo "✅ UE5_INSTALL_DIR: $UE5_DIR"

  # ─── Job 2: UE5 Headless Compile ─────────────────────────────────────────
  ue5-headless-compile:
    name: UE5 Headless Compile
    runs-on: [self-hosted, gpu]
    needs: register-gpu-runner
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve UE5 Install Dir
        run: |
          if [ -n "${{ secrets.UE5_INSTALL_DIR }}" ]; then
            UE5_DIR="${{ secrets.UE5_INSTALL_DIR }}"
          else
            UE5_DIR="/opt/unreal-engine/5.8"
          fi
          echo "UE5_INSTALL_DIR=$UE5_DIR" >> $GITHUB_ENV
          echo "UE5 Engine path: $UE5_DIR"

          if [ ! -d "$UE5_DIR" ]; then
            echo "❌ UE5 não encontrado em $UE5_DIR"
            echo "Configure o secret UE5_INSTALL_DIR ou instale o engine."
            exit 1
          fi
          echo "✅ UE5 engine encontrado"

      - name: Generate Project Files
        run: |
          # Gerar arquivos de projeto (Build.cs, etc.)
          "$UE5_INSTALL_DIR/Engine/Build/BatchFiles/Linux/GenerateProjectFiles.sh" \
            -project="$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -game \
            -engine
          echo "✅ Arquivos de projeto gerados"

      - name: Build UE5 (Headless)
        run: |
          # Compilação headless — sem RHI, sem editor, sem window
          "$UE5_INSTALL_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            KhaaosRunLinux \
            "${{ env.BUILD_CONFIGURATION }}" \
            -project="$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -NullRHI \
            -unattended \
            -NoP4 \
            -build
          echo "✅ Compilação headless completa"

      - name: Run Headless Unit Tests
        run: |
          # Executar testes unitários no modo headless
          "$UE5_INSTALL_DIR/Engine/Binaries/Linux/UnrealEditor-Cmd" \
            "$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -NullRHI \
            -unattended \
            -nopause \
            -TestRun="Automation" \
            -AutomatedMapBuildList \
            -log \
            -LogCmds="LogKhaaosRun Verbose"
          echo "✅ Testes unitários headless executados"

      - name: Collect Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khaaos-run-build-${{ github.sha }}
          path: |
            Unreal/KhaaosRun/Binaries/Linux/**
            Unreal/KhaaosRun/Intermediate/**
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: \`${{ env.BUILD_CONFIGURATION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **UE5 Path**: \`${{ env.UE5_INSTALL_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: \`self-hosted-gpu\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
