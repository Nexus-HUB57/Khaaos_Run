# ==============================================================================
# KHAAOS RUN — UE5.8 Editor Headless Build & Automation
# Compila o target Editor e executa o Automation Test de serialização de telemetria.
# Requer runner self-hosted com labels compatíveis e Unreal Engine 5.8 instalado.
# ==============================================================================
name: UE5 Editor Headless Build & Telemetry Test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "Unreal/KhaaosRun/Source/**"
      - "Unreal/KhaaosRun/KhaaosRun.uproject"
      - ".github/workflows/ue5-headless-compile.yml"
  workflow_dispatch:
    inputs:
      ue5_install_dir:
        description: "Caminho do Unreal Engine 5.8 no runner (ex.: /opt/unreal-engine/5.8)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  UE5_PROJECT: "Unreal/KhaaosRun/KhaaosRun.uproject"
  UE5_DEFAULT_INSTALL_DIR: "/opt/unreal-engine/5.8"

jobs:
  ue5-headless-compile:
    name: UE5.8 Editor Build + Telemetry Automation
    # Compilação e automação usam -NullRHI; GPU não é necessária. Benchmarks
    # gráficos permanecem no workflow ue58-release-cd.yml com label GPU.
    runs-on: [self-hosted, linux, ue5.8, x64]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve UE5 Install Dir
        shell: bash
        env:
          UE5_INPUT_DIR: ${{ github.event.inputs.ue5_install_dir }}
          UE5_SECRET_DIR: ${{ secrets.UE5_INSTALL_DIR }}
        run: |
          set -euo pipefail
          UE5_DIR="${UE5_INPUT_DIR:-${UE5_SECRET_DIR:-${UE5_DEFAULT_INSTALL_DIR}}}"
          if [ ! -x "$UE5_DIR/Engine/Build/BatchFiles/Linux/Build.sh" ]; then
            echo "Unreal Engine 5.8 não encontrado ou Build.sh indisponível em UE5_INSTALL_DIR."
            exit 1
          fi
          printf 'UE5_INSTALL_DIR=%s\n' "$UE5_DIR" >> "$GITHUB_ENV"
          echo "Unreal Engine encontrado; caminho configurado para as etapas deste job."

      - name: Generate Project Files
        shell: bash
        run: |
          set -euo pipefail
          "$UE5_INSTALL_DIR/Engine/Build/BatchFiles/Linux/GenerateProjectFiles.sh" \
            -project="$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -game \
            -engine
          echo "Arquivos de projeto gerados."

      - name: Build KhaaosRunEditor (Linux Development)
        shell: bash
        run: |
          set -euo pipefail
          "$UE5_INSTALL_DIR/Engine/Build/BatchFiles/Linux/Build.sh" \
            KhaaosRunEditor \
            Linux \
            Development \
            "$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -WaitMutex
          echo "Build do target KhaaosRunEditor concluído."

      - name: Generate LUT + PostProcess Material Assets
        shell: bash
        run: |
          set -euo pipefail
          "$UE5_INSTALL_DIR/Engine/Binaries/Linux/UnrealEditor-Cmd" \
            "$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -run=KhaaosLUTMaterialBuilder \
            -NullRHI \
            -unattended \
            -nopause \
            -nosplash \
            -log \
            -LogCmds="LogKhaaosRun Verbose"
          echo "Assets LUT e material de PostProcess gerados."

      - name: Validate LUTs Visually (PNG captures + report)
        shell: bash
        run: |
          set -euo pipefail
          "$UE5_INSTALL_DIR/Engine/Binaries/Linux/UnrealEditor-Cmd" \
            "$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -run=KhaaosLUTVisualValidator \
            -NullRHI \
            -unattended \
            -nopause \
            -nosplash \
            -log \
            -LogCmds="LogKhaaosRun Verbose"
          echo "Capturas e relatório de validação LUT gerados."

      - name: Run UE5 Telemetry and Combat/DBNO Automation Tests
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="$GITHUB_WORKSPACE/Unreal/KhaaosRun/Saved/AutomationReports"
          mkdir -p "$REPORT_DIR"
          "$UE5_INSTALL_DIR/Engine/Binaries/Linux/UnrealEditor-Cmd" \
            "$GITHUB_WORKSPACE/$UE5_PROJECT" \
            -NullRHI \
            -unattended \
            -nopause \
            -nosplash \
            -ExecCmds="Automation RunTest Khaaos.Telemetry.JsonSerialization;Automation RunTests Khaaos.Combat;Quit" \
            -ReportExportPath="$REPORT_DIR" \
            -log \
            -LogCmds="LogKhaaosRun Verbose"
          echo "Testes de automação Telemetry e Khaaos.Combat (inclui Revive/DBNO) executados."

      - name: Upload Unreal Automation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue5-automation-report-${{ github.sha }}
          path: Unreal/KhaaosRun/Saved/AutomationReports/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload LUT Validation Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lut-visual-validation-${{ github.sha }}
          path: Unreal/KhaaosRun/Saved/LUTValidation/**
          retention-days: 30
          if-no-files-found: warn

      - name: Collect Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khaaos-run-editor-build-${{ github.sha }}
          path: |
            Unreal/KhaaosRun/Binaries/Linux/**
            Unreal/KhaaosRun/Intermediate/**
            Unreal/KhaaosRun/Content/Graphics/LUTs/**
            Unreal/KhaaosRun/Content/Graphics/Materials/**
          retention-days: 7
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        shell: bash
        env:
          SUMMARY_BRANCH: ${{ github.ref_name }}
          SUMMARY_COMMIT: ${{ github.sha }}
          SUMMARY_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## UE5.8 Editor Build Summary"
            echo "- **Branch**: $SUMMARY_BRANCH"
            echo "- **Commit**: $SUMMARY_COMMIT"
            echo "- **Target**: KhaaosRunEditor Linux Development"
            echo "- **Automation Tests**: telemetry + Khaaos.Combat (inclui DBNO/revive)"
            echo "- **Runner labels**: self-hosted, linux, ue5.8, x64"
            echo "- **Job status**: $SUMMARY_JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
