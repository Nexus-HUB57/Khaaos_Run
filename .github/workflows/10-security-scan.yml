{
  "name": "10 — Security Scan",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "schedule": [
      {
        "cron": "0 6 * * 1"
      }
    ]
  },
  "jobs": {
    "security": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "npm audit",
          "run": "npm audit --audit-level=high || true"
        },
        {
          "name": "Trivy FS Scan",
          "uses": "aquasecurity/trivy-action@master",
          "with": {
            "scan-type": "fs",
            "scan-ref": "."
          }
        }
      ]
    }
  }
}