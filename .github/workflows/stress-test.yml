# Khaaos Run — Runtime stress smoke test
# This runs the deterministic local WebSocket stress harness; it does not load public regions.
name: Stress Test (local runtime)

on:
  workflow_dispatch:
  schedule:
    # Weekly local stress smoke test, Monday 03:00 UTC.
    - cron: '0 3 * * 1'

concurrency:
  group: stress-test-local-runtime
  cancel-in-progress: false

jobs:
  stress-test:
    name: Runtime stress harness (24 local clients)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game-runtime/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install runtime dependencies
        working-directory: game-runtime
        run: npm ci --no-audit --no-fund

      - name: Run local authenticated WebSocket stress test
        run: |
          echo 'This test exercises the local runtime harness (24 authenticated clients); it does not generate traffic against public regions.'
          set -o pipefail
          npm run test:game:stress 2>&1 | tee stress-test.log

      - name: Upload stress test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-stress-test
          path: stress-test.log
          if-no-files-found: ignore
          retention-days: 30
