{
  "name": "02 — CI TypeScript",
  "on": {
    "push": {
      "branches": [
        "main",
        "develop"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "ci-ts": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npx tsc --noEmit"
        }
      ]
    }
  }
}