{
  "name": "01 — CI C++ Compile",
  "on": {
    "push": {
      "branches": [
        "main",
        "develop"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "ci-cpp": {
      "runs-on": "ubuntu-22.04",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Install UE5.8 Toolchain",
          "run": "sudo apt-get update && sudo apt-get install -y build-essential clang-16 lld-16"
        },
        {
          "name": "Compile KhaaosRun Module",
          "run": "echo 'UE5 compile step — requires self-hosted runner in production'"
        }
      ]
    }
  }
}