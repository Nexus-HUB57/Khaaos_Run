{
  "name": "01 — C++ Logic Tests",
  "on": {
    "push": {
      "branches": [
        "main",
        "develop"
      ]
    },
    "pull_request": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "ci-cpp": {
      "runs-on": "ubuntu-22.04",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Install C++ test toolchain",
          "run": "sudo apt-get update && sudo apt-get install -y build-essential"
        },
        {
          "name": "Run production CIGKV logic tests",
          "run": "bash scripts/test_ue5_logic.sh"
        }
      ]
    }
  }
}