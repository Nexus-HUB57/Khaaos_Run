{
  "name": "06 — EOS Integration",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "eos": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "name": "EOS Auth Flow Test",
          "run": "npx vitest run tests/integration/eos-economy.integration.test.ts"
        }
      ]
    }
  }
}