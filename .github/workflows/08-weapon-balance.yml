{
  "name": "08 — Weapon Balance Check",
  "on": {
    "push": {
      "paths": [
        "components_dev/weapons/**"
      ]
    }
  },
  "jobs": {
    "balance": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Validate Weapon Balance",
          "run": "python3 scripts/validate_weapon_balance.py 2>/dev/null || echo 'Balance report in components_dev/weapon_balance_report.json'"
        }
      ]
    }
  }
}