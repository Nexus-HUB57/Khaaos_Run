name: Diagnose gcodegames.top

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Commit esperado no servidor; vazio apenas informa o commit remoto"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-gcodegames
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only SSH diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CREDENCIAIS_SSH: ${{ secrets.CREDENCIAIS_SSH }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Parse and validate SSH secret without printing values
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/credenciais_ssh.env"
          printf '%s\n' "$CREDENCIAIS_SSH" > "$raw"
          chmod 600 "$raw"
          python3 - "$raw" "$GITHUB_ENV" <<'PY'
          import re, sys
          from pathlib import Path

          src = Path(sys.argv[1]).read_text()
          out = Path(sys.argv[2])
          pairs = {}
          current = None
          for line in src.splitlines():
              m = re.match(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$', line)
              if m:
                  key, value = m.group(1), m.group(2)
                  pairs[key] = value.strip().strip('"').strip("'")
                  current = key
              elif current in {'SSH_PRIVATE_KEY', 'PRIVATE_KEY', 'SSH_KEY', 'SSH_HOST_KEY'}:
                  if line.strip() and not line.lstrip().startswith('#'):
                      pairs[current] += '\n' + line

          def first(*names):
              for name in names:
                  value = pairs.get(name, '')
                  if value:
                      return value
              return ''

          def by_key(patterns, exclude=()):
              for key, value in pairs.items():
                  low = key.lower()
                  if any(re.search(pattern, low) for pattern in patterns) and not any(re.search(pattern, low) for pattern in exclude):
                      if value:
                          return value
              return ''

          key_value = first('SSH_PRIVATE_KEY', 'PRIVATE_KEY', 'SSH_KEY', 'CHAVE_PRIVADA', 'CHAVE_SSH', 'CHAVE')
          if not key_value:
              for key, value in pairs.items():
                  low = key.lower()
                  if re.search(r'key|chave|privat|privad', low) and (len(value) > 100 or 'BEGIN' in value):
                      key_value = value
                      break
          key_value = key_value.replace('\\n', '\n')

          target = first('SSH_TARGET', 'REMOTE_TARGET', 'SSH_DESTINATION')
          target_user = target_host = ''
          if target and '@' in target:
              target_user, target_host = target.rsplit('@', 1)

          values = {
              'SSH_HOST': first('SSH_HOST', 'HOST', 'REMOTE_HOST', 'SSH_SERVER', 'SERVER_HOST', 'SSH_IP', 'SERVER_IP', 'SERVIDOR', 'ENDERECO', 'ENDEREÇO', 'IP_SERVIDOR') or target_host or by_key((r'host', r'server', r'servidor', r'maquina', r'máquina', r'endpoint', r'address', r'endereco', r'endereço', r'(^|_)ip($|_)'), (r'user', r'usuario', r'usuário', r'path', r'caminho', r'key', r'chave')),
              'SSH_USER': first('SSH_USER', 'USER', 'SSH_USERNAME', 'USERNAME', 'REMOTE_USER', 'SSH_LOGIN', 'USUARIO', 'USUÁRIO', 'UTILIZADOR') or target_user or by_key((r'user', r'username', r'usuario', r'usuário', r'utilizador', r'login', r'account'), (r'path', r'caminho', r'key', r'chave')),
              'SSH_PORT': first('SSH_PORT', 'PORT', 'REMOTE_PORT', 'PORTA') or by_key((r'port', r'porta'), ()) or '22',
              'SSH_PRIVATE_KEY': key_value,
              'REMOTE_PATH': first('REMOTE_PATH', 'PROJECT_PATH', 'CHECKOUT_PATH', 'REMOTE_PROJECT_PATH', 'PROJECT_DIR', 'REPO_PATH', 'APP_PATH', 'CAMINHO', 'CAMINHO_PROJETO', 'DIRETORIO', 'DIRETÓRIO', 'PASTA', 'REPOSITORIO', 'REPOSITÓRIO') or by_key((r'path', r'caminho', r'dir', r'diretorio', r'diretório', r'pasta', r'directory', r'project', r'projeto', r'checkout', r'repo', r'repositorio', r'repositório', r'root'), (r'key', r'chave', r'private', r'privad')),
          }
          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit('CREDENCIAIS_SSH ausente/incompleto: ' + ', '.join(missing))
          if not values['SSH_PORT'].isdigit() or not 1 <= int(values['SSH_PORT']) <= 65535:
              raise SystemExit('SSH_PORT inválida')
          if 'PRIVATE KEY' not in values['SSH_PRIVATE_KEY']:
              raise SystemExit('SSH_PRIVATE_KEY não parece ser uma chave PEM/OpenSSH')

          with out.open('a') as f:
              for key, value in values.items():
                  f.write(f'{key}<<KR_ENV_EOF\n{value}\nKR_ENV_EOF\n')
          print('Credenciais presentes e formato validado; valores omitidos.')
          PY

      - name: Configure ephemeral SSH client
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_key"
          chmod 600 "$RUNNER_TEMP/ssh/id_key"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>"$RUNNER_TEMP/ssh/keyscan.err" || {
            echo "::error::Não foi possível obter a chave SSH do host configurado."
            sed -n '1,5p' "$RUNNER_TEMP/ssh/keyscan.err"
            exit 1
          }
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Run read-only remote diagnostics
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gcodegames-diagnostic.txt"
          ssh_cmd=(ssh -i "$RUNNER_TEMP/ssh/id_key" -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          "${ssh_cmd[@]}" bash -s -- "$REMOTE_PATH" > "$report" 2>&1 <<'REMOTE_SCRIPT'
          set +e
          root="$1"
          section() { printf '\n===== %s =====\n' "$1"; }
          redact() { sed -E 's/(password|token|secret|authorization|KR_USERS_JSON)[^[:space:]]*/\1=<redacted>/Ig'; }

          section identity
          hostname 2>&1
          date -u 2>&1
          uptime 2>&1
          uname -a 2>&1
          id 2>&1

          section disk-and-memory
          df -h 2>&1
          free -h 2>&1 || true

          section listeners
          ss -lntp 2>&1 || netstat -lntp 2>&1 || true

          section services
          for unit in nginx apache2 httpd docker; do
            printf '\n-- %s --\n' "$unit"
            systemctl is-active "$unit" 2>&1 || true
            systemctl is-enabled "$unit" 2>&1 || true
          done

          section containers
          if command -v docker >/dev/null 2>&1; then
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1
            (cd "$root" && docker compose ps 2>&1) || true
          else
            echo 'docker not installed'
          fi

          section compose-validation
          if [ -d "$root" ] && command -v docker >/dev/null 2>&1; then
            (cd "$root" && docker compose config --quiet) 2>&1
            echo "compose_config_exit=$?"
          fi

          section container-logs
          if [ -d "$root" ] && command -v docker >/dev/null 2>&1; then
            (cd "$root" && docker compose logs --tail=160 --timestamps --no-color 2>&1) | redact | tail -n 240
          fi

          section local-health
          for url in http://127.0.0.1/readyz http://127.0.0.1/healthz.json http://127.0.0.1:8080/readyz http://127.0.0.1:3000/readyz; do
            echo "-- $url --"
            curl -sS -i --max-time 8 "$url" 2>&1 | sed -n '1,24p' || true
          done
          command -v nginx >/dev/null 2>&1 && nginx -t 2>&1 || true

          section repository
          if [ -d "$root/.git" ]; then
            cd "$root"
            printf 'path='; pwd
            printf 'branch='; git branch --show-current 2>&1
            printf 'head='; git rev-parse HEAD 2>&1
            printf 'describe='; git describe --always --dirty 2>&1
            printf 'status=\n'; git status --short 2>&1
          else
            echo "REMOTE_PATH não contém .git: $root"
          fi
          REMOTE_SCRIPT

          cat "$report"
          {
            printf '\n===== local-comparison =====\n'
            printf 'expected_commit=%s\n' "${EXPECTED_COMMIT:-<not-provided>}"
            if [[ -n "${EXPECTED_COMMIT:-}" ]] && grep -q "^head=${EXPECTED_COMMIT}$" "$report"; then
              echo 'commit_match=true'
            elif [[ -n "${EXPECTED_COMMIT:-}" ]]; then
              echo 'commit_match=false'
            else
              echo 'commit_match=not-requested'
            fi
          } >> "$report"

      - name: Upload sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcodegames-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/gcodegames-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
