name: Diagnose gcodegames.top

on:
  workflow_dispatch:
    inputs:
      ssh_host_secret:
        description: "Nome do Secret com o host/IP SSH"
        required: true
        default: GCODEGAMES_SSH_HOST
        type: string
      ssh_user_secret:
        description: "Nome do Secret com o usuário SSH"
        required: true
        default: GCODEGAMES_SSH_USER
        type: string
      ssh_private_key_secret:
        description: "Nome do Secret com a chave privada SSH"
        required: true
        default: GCODEGAMES_SSH_PRIVATE_KEY
        type: string
      ssh_port_secret:
        description: "Nome do Secret com a porta SSH"
        required: true
        default: GCODEGAMES_SSH_PORT
        type: string
      remote_path_secret:
        description: "Nome do Secret com o caminho do checkout remoto"
        required: true
        default: GCODEGAMES_REMOTE_PATH
        type: string
      expected_commit:
        description: "Commit esperado no servidor; vazio apenas informa o commit remoto"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-gcodegames
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only SSH diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets[inputs.ssh_host_secret] }}
      SSH_USER: ${{ secrets[inputs.ssh_user_secret] }}
      SSH_PRIVATE_KEY: ${{ secrets[inputs.ssh_private_key_secret] }}
      SSH_PORT: ${{ secrets[inputs.ssh_port_secret] }}
      REMOTE_PATH: ${{ secrets[inputs.remote_path_secret] }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Validate required secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_PORT REMOTE_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret resolvido para $name está vazio ou não existe."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Configure os Secrets indicados nos inputs do workflow e execute novamente."
            exit 1
          fi
          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]] || (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo "::error::SSH_PORT não é uma porta TCP válida."
            exit 1
          fi
          echo "Credenciais presentes; valores não serão exibidos."

      - name: Configure SSH without persisting credentials
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>"$RUNNER_TEMP/ssh/keyscan.err" || {
            echo "::error::Não foi possível obter a chave SSH do host configurado."
            sed -n '1,5p' "$RUNNER_TEMP/ssh/keyscan.err"
            exit 1
          }
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_USER=$SSH_USER"
            echo "REMOTE_PATH=$REMOTE_PATH"
          } >> "$GITHUB_ENV"

      - name: Run read-only remote diagnostics
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gcodegames-diagnostic.txt"
          ssh_cmd=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" "$SSH_USER@$SSH_HOST")
          remote_command="REMOTE_PATH=$(printf '%q' "$REMOTE_PATH") bash -s"
          remote_script=$(cat <<'REMOTE_SCRIPT'
          set +e
          section() { printf '\n===== %s =====\n' "$1"; }
          section "identity"
          hostname 2>&1
          date -u 2>&1
          uptime 2>&1
          uname -a 2>&1
          id 2>&1

          section "disk-and-memory"
          df -h 2>&1
          free -h 2>&1 || true

          section "listeners"
          ss -lntp 2>&1 || netstat -lntp 2>&1 || true

          section "web-processes"
          ps -eo user,pid,ppid,stat,lstart,cmd --sort=-%cpu 2>&1 | sed -n '1,80p'

          section "systemd-failures"
          systemctl --failed --no-pager 2>&1 || true
          for unit in nginx apache2 httpd docker; do
            printf '\n-- %s --\n' "$unit"
            systemctl is-active "$unit" 2>&1 || true
            systemctl is-enabled "$unit" 2>&1 || true
          done

          section "containers"
          if command -v docker >/dev/null 2>&1; then
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1
            docker compose ps 2>&1 || true
          else
            echo "docker not installed"
          fi

          section "tls-and-local-http"
          for url in http://127.0.0.1/ https://127.0.0.1/; do
            echo "-- $url --"
            curl -k -sS -I --max-time 10 "$url" 2>&1 | sed -n '1,20p' || true
          done
          if command -v nginx >/dev/null 2>&1; then
            nginx -t 2>&1 || true
          fi

          section "repository"
          if [[ -d "$REMOTE_PATH/.git" ]]; then
            cd "$REMOTE_PATH"
            printf 'path='; pwd
            printf 'branch='; git branch --show-current 2>&1
            printf 'head='; git rev-parse HEAD 2>&1
            printf 'describe='; git describe --always --dirty 2>&1
            printf 'status=\n'; git status --short 2>&1
            printf 'origin=\n'; git remote -v 2>&1 | sed -E 's#(https?://)[^/@]+:[^/@]+@#\1***:***@#g'
          else
            echo "REMOTE_PATH não contém .git: $REMOTE_PATH"
          fi
          REMOTE_SCRIPT
          )
          "${ssh_cmd[@]}" "$remote_command" > "$report" 2>&1 <<EOF
          $remote_script
          EOF

          cat "$report"
          {
            echo "\n===== local-comparison ====="
            echo "expected_commit=${EXPECTED_COMMIT:-<not-provided>}"
            if [[ -n "${EXPECTED_COMMIT:-}" ]] && grep -q "^head=${EXPECTED_COMMIT}$" "$report"; then
              echo "commit_match=true"
            elif [[ -n "${EXPECTED_COMMIT:-}" ]]; then
              echo "commit_match=false"
            else
              echo "commit_match=not-requested"
            fi
          } >> "$report"

          if [[ -n "${EXPECTED_COMMIT:-}" ]] && ! grep -q "^head=${EXPECTED_COMMIT}$" "$report"; then
            echo "::warning::O commit remoto não corresponde ao commit esperado; isso não falha o diagnóstico."
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcodegames-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/gcodegames-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
