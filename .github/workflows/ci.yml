name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify official app and game runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game-runtime/package-lock.json

      - name: Install official app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install game runtime dependencies
        working-directory: game-runtime
        run: npm ci --no-audit --no-fund

      - name: Verify both projects
        run: npm run verify:all

  deploy:
    name: Deploy verified commit to Render
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: render-production-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo 'Missing GitHub Actions secret: RENDER_DEPLOY_HOOK_URL' >&2
            exit 1
          fi
          response=$(curl --fail --silent --show-error --max-time 20 \
            --request POST --get \
            --data-urlencode "ref=${COMMIT_SHA}" \
            "${RENDER_DEPLOY_HOOK_URL}")
          deploy_id=$(jq -r '.deploy.id // empty' <<<"${response}")
          if [[ -n "${deploy_id}" ]]; then
            echo "Render accepted deploy ${deploy_id} for ${COMMIT_SHA}."
          else
            echo "Render accepted or queued deploy for ${COMMIT_SHA}; the health check will verify completion."
          fi

      - name: Wait for the exact commit to pass Render health check
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_SERVICE_URL}" ]]; then
            echo 'Missing GitHub Actions variable: RENDER_SERVICE_URL' >&2
            exit 1
          fi
          health_url="${RENDER_SERVICE_URL%/}/healthz"
          for attempt in $(seq 1 180); do
            body=$(curl --fail --silent --show-error --max-time 10 \
              "${health_url}" 2>/dev/null || true)
            if [[ -n "${body}" ]] && jq -e \
              --arg sha "${COMMIT_SHA}" \
              '.status == "ok" and .commit == $sha' \
              <<<"${body}" >/dev/null; then
              echo "Render is healthy on commit ${COMMIT_SHA}."
              exit 0
            fi
            echo "Waiting for Render to serve ${COMMIT_SHA} (attempt ${attempt}/180)."
            sleep 10
          done
          echo "Render did not report healthy commit ${COMMIT_SHA} within 30 minutes." >&2
          exit 1

  notify:
    name: Notify on pipeline failure
    needs: [verify, deploy]
    if: always() && (needs.verify.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Discord and/or Slack notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          message="CI falhou em ${REPOSITORY} (${BRANCH}, commit ${COMMIT:0:7}). Detalhes: ${RUN_URL}"
          sent=false

          if [[ -n "${DISCORD_WEBHOOK_URL}" ]]; then
            payload=$(jq -n --arg content "$message" '{content: $content}')
            curl --fail --silent --show-error --max-time 15 \
              -H 'Content-Type: application/json' \
              -d "$payload" "$DISCORD_WEBHOOK_URL" >/dev/null
            sent=true
          fi

          if [[ -n "${SLACK_WEBHOOK_URL}" ]]; then
            payload=$(jq -n --arg text "$message" '{text: $text}')
            curl --fail --silent --show-error --max-time 15 \
              -H 'Content-Type: application/json' \
              -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
            sent=true
          fi

          if [[ "$sent" != true ]]; then
            echo 'Nenhum webhook configurado. Adicione DISCORD_WEBHOOK_URL e/ou SLACK_WEBHOOK_URL nos Actions secrets do repositório.'
          fi
