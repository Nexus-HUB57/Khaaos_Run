name: MP-ZEX-08 — Staging

on:
  pull_request:
    branches: [main]
    paths:
      - 'game-runtime/server/room3d.js'
      - 'game-runtime/server/server.js'
      - 'game-runtime/scripts/run-mp-zex-08-staging.mjs'
      - '.github/workflows/mp-zex-08-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma partida MP-ZEX-08 por vez no staging; nunca cancela uma execução ativa,
# pois cancelar sockets no meio do canal pode deixar a sala de teste aberta.
concurrency:
  group: mp-zex-08-staging
  cancel-in-progress: false

jobs:
  mp-zex-08:
    name: MP-ZEX-08 em staging remoto
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar configuração sem exibir valores
        shell: bash
        env:
          KR_STAGING_BASE_URL: ${{ secrets.KR_STAGING_BASE_URL }}
          KR_STAGING_TEST_USER_A: ${{ secrets.KR_STAGING_TEST_USER_A }}
          KR_STAGING_TEST_PASSWORD_A: ${{ secrets.KR_STAGING_TEST_PASSWORD_A }}
          KR_STAGING_TEST_USER_B: ${{ secrets.KR_STAGING_TEST_USER_B }}
          KR_STAGING_TEST_PASSWORD_B: ${{ secrets.KR_STAGING_TEST_PASSWORD_B }}
        run: |
          set -euo pipefail
          missing=()
          for name in KR_STAGING_BASE_URL KR_STAGING_TEST_USER_A KR_STAGING_TEST_PASSWORD_A KR_STAGING_TEST_USER_B KR_STAGING_TEST_PASSWORD_B; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Configure no GitHub Environment "staging" os secrets obrigatórios: %s\n' "${missing[*]}"
            exit 1
          fi
          echo 'Secrets obrigatórios presentes; valores omitidos.'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game-runtime/package-lock.json

      - name: Instalar dependências runtime
        working-directory: game-runtime
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Executar MP-ZEX-08 em duas sessões reais
        env:
          KR_STAGING_BASE_URL: ${{ secrets.KR_STAGING_BASE_URL }}
          KR_STAGING_TEST_USER_A: ${{ secrets.KR_STAGING_TEST_USER_A }}
          KR_STAGING_TEST_PASSWORD_A: ${{ secrets.KR_STAGING_TEST_PASSWORD_A }}
          KR_STAGING_TEST_USER_B: ${{ secrets.KR_STAGING_TEST_USER_B }}
          KR_STAGING_TEST_PASSWORD_B: ${{ secrets.KR_STAGING_TEST_PASSWORD_B }}
          KR_STAGING_ALLOW_CUSTOM_HOST: ${{ vars.KR_STAGING_ALLOW_CUSTOM_HOST }}
        run: node game-runtime/scripts/run-mp-zex-08-staging.mjs
