# =============================================================================
# Khaaos Run — UE5.8 Preflight (sem engine)
# =============================================================================
# Valida a estrutura do projeto UE5.8 em runners hosted (ubuntu-latest), sem
# precisar do Editor/SDK: .uproject, targets, Build.cs, resolução de includes
# de projeto e GENERATED_BODY. É o portão de entrada do build UE5.8 — a
# compilação real (ue58-container-build.yml / ue5-headless-compile.yml) só é
# acionada quando um binário de engine está disponível, e por isso este job
# é o que roda em TODA PR.
# =============================================================================

name: UE5.8 Preflight

on:
  pull_request:
    paths:
      - 'Unreal/KhaaosRun/**'
      - 'README.md' # F46: o README é a fonte do cânon — mudou, o portão re-certifica antes do export
      - 'game-runtime/scripts/fidelity-audit-lib.mjs' # F46: instrumento F44
      - 'game-runtime/scripts/fidelity-snapshot.mjs'
      - 'game-runtime/scripts/audit-fidelity.mjs'
      - 'game-runtime/src/game3d/scenarios.js' # F46: fontes da geometria canônica consumida pelo pipeline UE
      - 'game-runtime/src/game3d/world3d.js'
      - 'game-runtime/src/game3d/districts3d.js'
      - 'scripts/build/ue58_preflight.mjs'
      - 'scripts/build/fix_ue1021_includes.py'
      - 'scripts/build/export_barburhen_obj.py'
      - 'scripts/build/bake_barburhen_colliders.py'
      - 'scripts/build/import_barburhen_map.py'
      - 'scripts/build/audit_mobile_environment_assets.py'
      - '.github/workflows/ue5-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'Unreal/KhaaosRun/**'
      - 'README.md' # F46: o README é a fonte do cânon — mudou, o portão re-certifica antes do export
      - 'game-runtime/scripts/fidelity-audit-lib.mjs' # F46: instrumento F44
      - 'game-runtime/scripts/fidelity-snapshot.mjs'
      - 'game-runtime/scripts/audit-fidelity.mjs'
      - 'game-runtime/src/game3d/scenarios.js' # F46: fontes da geometria canônica consumida pelo pipeline UE
      - 'game-runtime/src/game3d/world3d.js'
      - 'game-runtime/src/game3d/districts3d.js'
      - 'scripts/build/ue58_preflight.mjs'
      - 'scripts/build/fix_ue1021_includes.py'
      - 'scripts/build/export_barburhen_obj.py'
      - 'scripts/build/bake_barburhen_colliders.py'
      - 'scripts/build/import_barburhen_map.py'
      - 'scripts/build/audit_mobile_environment_assets.py'
      - '.github/workflows/ue5-preflight.yml'

concurrency:
  group: ue5-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: UE5.8 Project Preflight (engine-less)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # estrutura C#/ini não depende de LFS; mais rápido sem fetch

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fidelity gate — Mundos ↔ README (F44/F46)
        # O pipeline UE5.8 CONSUME a geometria do runtime (export OBJ →
        # colliders → import da engine). Este portão roda o instrumento F44 AO
        # VIVO (lê o README, constrói os 5 mundos headless, valida os checks
        # canônicos) ANTES do export — geometria derivada do cânon nunca é
        # cozida no build da engine. Falha RÁPIDO, com o check nomeado.
        run: |
          cd game-runtime
          npm ci --no-audit --no-fund
          npm run audit:fidelity

      - name: CI guard — UE1021 canonical includes (fix_ue1021_includes.py)
        # Guard de regeneração UE: UHT/scaffolds podem reemitir includes de
        # projeto sem o caminho do módulo (ex.: #include "KhaaosRingManager.h"),
        # quebrando o build real. Falha RÁPIDO aqui, com a lista exata do que
        # a regeneração quebrou e o comando de correção.
        run: |
          python3 scripts/build/fix_ue1021_includes.py selftest
          python3 scripts/build/fix_ue1021_includes.py check Unreal/KhaaosRun

      - name: Fase 1 — Barburhen OBJ + colliders complexos (engine-less)
        # Pipeline determinística do mapa Barburhen: export OBJ + baking de
        # colliders complexos + contrato de import. Os selftests validam
        # parser/decimação/determinismo byte a byte SEM engine.
        run: |
          python3 scripts/build/export_barburhen_obj.py --selftest
          python3 scripts/build/bake_barburhen_colliders.py --selftest
          python3 scripts/build/export_barburhen_obj.py mvp_output/assets/worlds/Barburhen_Map.obj
          python3 scripts/build/bake_barburhen_colliders.py mvp_output/assets/worlds/Barburhen_Map.obj mvp_output/assets/worlds/Barburhen_colliders.json
          ls -la mvp_output/assets/worlds/

      - name: Mobile environment assets — edifícios, pontes e veículos
        # Inventário engine-less publica blockers sem converter ausência em PASS de cook/FPS.
        run: |
          python3 scripts/build/audit_mobile_environment_assets.py --self-test
          python3 scripts/build/audit_mobile_environment_assets.py --output "$RUNNER_TEMP/mobile-environment-asset-audit.json"
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'mobile-environment-asset-audit.json')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Mobile environment asset audit\n\n')
              summary.write(f"Overall: `{report['overall_status']}`; native Unreal assets: `{report['native_unreal_asset_count']}`.\n\n")
              for category, record in report['categories'].items():
                  summary.write(f"- {category}: `{record['status']}`; source packs={record['source_asset_count']}; named objects={record['named_object_count']}.\n")
              summary.write('\nNo editor import, cook, or physical-device FPS is asserted by this engine-less audit.\n')
          PY

      - name: Selftest do relatório UE5.8/EAC unblock (relatório + sonda ghcr)
        # Fase 31+ — contrato do relatório de bloqueios (ue58_eac_unblock.mjs)
        # e da sonda ghcr de 2 camadas, 100% offline (APIs mockadas).
        run: node scripts/build/ue58_eac_unblock_selftest.mjs

      - name: Validate UE5.8 project structure
        run: node scripts/build/ue58_preflight.mjs Unreal/KhaaosRun

      - name: Summary
        if: always()
        run: |
          {
            echo "## UE5.8 Preflight"
            echo ""
            echo "| Cheque | Estado |"
            echo "|--------|--------|"
            echo "| EngineAssociation 5.8 | $(node scripts/build/ue58_preflight.mjs Unreal/KhaaosRun >/dev/null 2>&1 && echo OK || echo ERROS) |"
            echo "| Guard UE1021 (fix_ue1021_includes) | $(python3 scripts/build/fix_ue1021_includes.py check Unreal/KhaaosRun >/dev/null 2>&1 && echo OK || echo VIOLAÇÃO) |"
            echo "| Fase 1 — Barburhen OBJ + colliders | $(python3 scripts/build/export_barburhen_obj.py --selftest >/dev/null 2>&1 && python3 scripts/build/bake_barburhen_colliders.py --selftest >/dev/null 2>&1 && echo OK || echo ERROS) |"
            echo "| Mobile env assets audit | $(python3 scripts/build/audit_mobile_environment_assets.py --self-test >/dev/null 2>&1 && echo OK || echo ERROS) |"
            echo "| Unblock UE5.8/EAC (relatório + sonda ghcr) | $(node scripts/build/ue58_eac_unblock_selftest.mjs >/dev/null 2>&1 && echo OK || echo ERROS) |"
            echo "| Fidelidade Mundos ↔ README (F44) | $(cd game-runtime && npm run audit:fidelity >/dev/null 2>&1 && echo '✅ FIEL' || echo '❌ DERIVA') |"
            echo "| Game/Editor/Server targets | ✅ validados no preflight |"
            echo "| Includes de projeto | ✅ resolvidos em Source/ |"
          } >> $GITHUB_STEP_SUMMARY
          echo "Compilação real (engine) fica nos workflows ue58-container-build/ue5-headless-compile."
