# =============================================================================
# Khaaos Run — UE5.8 Compile via Official Container (Epic Games)
# =============================================================================
# Caminho de compilação REAL do UE5.8 em runners hosted: usa as imagens
# oficiais de contêiner da Epic (ghcr.io/epicgames/unreal-engine), construídas
# pela própria Epic a partir do código-fonte licenciado (EULA).
#
# PRÉ-REQUISITO (único passo manual, feito uma vez):
#   1. Conta GitHub vinculada à Epic Games (aceitar a EULA da UE e vincular em
#      https://epicgames.com/account/connected).
#   2. PAT clássico dessa conta com escopo `read:packages`.
#   3. Settings → Secrets and variables → Actions:
#        - Secret  UE_CONTAINER_PAT (preferido) ou UNREAL_ENGINE_LOGIN
#        - Variable UE_CONTAINER_IMAGE = tag da imagem (opcional; confira as
#          tags publicadas em github.com/orgs/epicgames/packages — ex.
#          dev-slim-5.8.0; o default abaixo assume dev-slim-5.8)
#        - Variable UE_CONTAINER_USER (opcional) = usuário da credencial ghcr
#
# CONTRATO DE CREDENCIAL (validação FUNCIONAL desde Fase 31+):
#   O gate faz `docker login ghcr.io` com a MESMA combinação que o job de
#   build consumirá (password = valor do secret VERBATIM; username =
#   UE_CONTAINER_USER > prefixo de UNREAL_ENGINE_LOGIN "user:token" > actor).
#   Credencial ausente ou INVÁLIDA (ghcr "denied") => build PULADO com
#   diagnóstico completo no $GITHUB_STEP_SUMMARY — a CI NUNCA fica vermelha
#   por credencial de engine (estrutura é validada no ue5-preflight.yml).
#   Diagnóstico de referência: run #9 do ue-infra-smoke (2026-10-28, linha
#   226) registrou UNREAL_ENGINE_LOGIN com "denied" — valor presente mas
#   não autenticável; com este gate o build nem inicia nesse estado.
# Referência: https://unrealcontainers.com/docs/obtaining-images/epic
# =============================================================================

name: UE5.8 Container Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        options: [Development, Shipping]
        default: Development
      target:
        description: 'Build target'
        type: choice
        options: [KhaaosRunServer, KhaaosRun, KhaaosRunEditor]
        default: KhaaosRunServer
  push:
    branches: [main]
    paths:
      - 'Unreal/KhaaosRun/Source/**'
      - '.github/workflows/ue58-container-build.yml'

concurrency:
  group: ue58-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Engine image gate (ghcr validado funcionalmente)
    runs-on: ubuntu-latest
    outputs:
      has_pat: ${{ steps.validate.outputs.has_pat }}
      login_user: ${{ steps.validate.outputs.login_user }}
    steps:
      - name: Validação funcional da credencial ghcr (UE_CONTAINER_PAT || UNREAL_ENGINE_LOGIN)
        id: validate
        env:
          UE_CONTAINER_PAT: ${{ secrets.UE_CONTAINER_PAT }}
          UE_LOGIN: ${{ secrets.UNREAL_ENGINE_LOGIN }}
          UE_CONTAINER_USER: ${{ vars.UE_CONTAINER_USER }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### UE5.8 Container Build — gate de credencial"
            echo ""
          } > "$GITHUB_STEP_SUMMARY"

          # Resolução IDÊNTICA ao job de build: password = valor do secret
          # VERBATIM (UE_CONTAINER_PAT || UNREAL_ENGINE_LOGIN).
          CRED=""; CRED_KIND="none"
          if [ -n "$UE_CONTAINER_PAT" ]; then
            CRED="$UE_CONTAINER_PAT"; CRED_KIND="UE_CONTAINER_PAT"
          elif [ -n "$UE_LOGIN" ]; then
            CRED="$UE_LOGIN"; CRED_KIND="UNREAL_ENGINE_LOGIN"
          fi

          if [ -z "$CRED" ]; then
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            {
              echo "**PULADO** — nenhuma credencial ghcr (UE_CONTAINER_PAT / UNREAL_ENGINE_LOGIN). Não é falha de CI:"
              echo "estrutura é validada no ue5-preflight.yml; a compilação exige o binário licenciado."
              echo ""
              echo "**Destravar (1x):** PAT de conta vinculada à Epic (EULA + read:packages) → `gh secret set UE_CONTAINER_PAT`"
              echo "(alternativa: `UNREAL_ENGINE_LOGIN` com o token — ver contrato no cabeçalho deste workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ sem credencial ghcr — build de engine PULADO (não é falha)."
            exit 0
          fi

          # Username candidato: var UE_CONTAINER_USER > prefixo "user:" do
          # UNREAL_ENGINE_LOGIN (formato user:token) > github.actor.
          RAW_VALUE="$CRED"
          SPLIT_USER=""; SPLIT_TOKEN=""
          if [ "$CRED_KIND" = "UNREAL_ENGINE_LOGIN" ] && [[ "$CRED" == *:* ]]; then
            SPLIT_USER="${CRED%%:*}"; SPLIT_TOKEN="${CRED#*:}"
          fi
          LOGIN_USER="${UE_CONTAINER_USER:-}"
          [ -z "$LOGIN_USER" ] && [ -n "$SPLIT_USER" ] && LOGIN_USER="$SPLIT_USER"
          LOGIN_USER="${LOGIN_USER:-$ACTOR}"

          LOGIN_ERR="$(mktemp)"
          # O job de build usa password = RAW_VALUE VERBATIM. PATs do GitHub
          # NUNCA contêm ':', então um valor "user:token" não funciona
          # verbatim como senha — nesse caso validamos o token dividido SÓ
          # para diagnóstico e apontamos a correção exata (build-fiel).
          if [ -n "$SPLIT_TOKEN" ]; then
            if echo "$SPLIT_TOKEN" | docker login ghcr.io --username "$LOGIN_USER" --password-stdin 2>"$LOGIN_ERR"; then
              echo "has_pat=false" >> "$GITHUB_OUTPUT"
              {
                echo "- 🟡 **token VÁLIDO detectado no formato \`user:token\`** (usuário \`$LOGIN_USER\`) — MAS o build usa o valor do secret VERBATIM como senha, e um valor com \`:\` nunca autentica."
                echo ""
                echo "**Correção exata (1 linha):** re-grave o secret com SÓ o token (sem o prefixo \`\$LOGIN_USER:\`) → \`gh secret set UNREAL_ENGINE_LOGIN\`, ou use o secret \`UE_CONTAINER_PAT\`. Depois re-executar este workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::token válido em formato user:token — o build container exige SÓ o token (ver summary)"
            else
              echo "has_pat=false" >> "$GITHUB_OUTPUT"
              {
                echo "- ❌ **\`$CRED_KIND\` NÃO autentica no ghcr** (usuário \`$LOGIN_USER\`, formato \`user:token\`) — build SKIPPED (a CI NÃO falha por isso)."
                echo ""
                echo '```'
                grep -i -m 3 'denied\|unauthorized\|error' "$LOGIN_ERR" || head -3 "$LOGIN_ERR"
                echo '```'
                echo ""
                echo "**Correção exata (valide cada camada):**"
                echo "1. conta GitHub **vinculada à Epic Games** com EULA aceito (epicgames.com/account/connected);"
                echo "2. PAT clássico com escopo \`read:packages\`;"
                echo "3. `gh secret set UE_CONTAINER_PAT` (preferido) ou `UNREAL_ENGINE_LOGIN` = SÓ o token;"
                echo "4. re-executar este workflow — o gate revalida antes de entrar no container."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$CRED_KIND presente mas NÃO autentica no ghcr — build pulado com diagnóstico no summary"
            fi
          elif echo "$RAW_VALUE" | docker login ghcr.io --username "$LOGIN_USER" --password-stdin 2>"$LOGIN_ERR"; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
            echo "login_user=$LOGIN_USER" >> "$GITHUB_OUTPUT"
            {
              echo "- ✅ **\`$CRED_KIND\` autentica no ghcr** (usuário \`$LOGIN_USER\`) — build de engine habilitado."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "✅ credencial ghcr VÁLIDA ($CRED_KIND, usuário $LOGIN_USER) — build habilitado"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            {
              echo "- ❌ **\`$CRED_KIND\` NÃO autentica no ghcr** (usuário \`$LOGIN_USER\`) — build SKIPPED (a CI NÃO falha por isso)."
              echo ""
              echo '```'
              grep -i -m 3 'denied\|unauthorized\|error' "$LOGIN_ERR" || head -3 "$LOGIN_ERR"
              echo '```'
              echo ""
              echo "**Correção exata (valide cada camada):**"
              echo "1. conta GitHub **vinculada à Epic Games** com EULA aceito (epicgames.com/account/connected);"
              echo "2. PAT clássico com escopo \`read:packages\`;"
              echo "3. `gh secret set UE_CONTAINER_PAT` (preferido) ou `UNREAL_ENGINE_LOGIN` = SÓ o token;"
              echo "4. re-executar este workflow — o gate revalida antes de entrar no container."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$CRED_KIND presente mas NÃO autentica no ghcr — build pulado com diagnóstico no summary"
          fi
          rm -f "$LOGIN_ERR"

  build:
    name: UBT Build (${{ github.event.inputs.target || 'KhaaosRunServer' }} / ${{ github.event.inputs.configuration || 'Development' }})
    needs: gate
    if: needs.gate.outputs.has_pat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ${{ vars.UE_CONTAINER_IMAGE || 'ghcr.io/epicgames/unreal-engine:dev-slim-5.8' }}
      credentials:
        # username resolvido e VALIDADO funcionalmente pelo gate (var
        # UE_CONTAINER_USER > prefixo de UNREAL_ENGINE_LOGIN > actor).
        username: ${{ needs.gate.outputs.login_user || github.actor }}
        password: ${{ secrets.UE_CONTAINER_PAT || secrets.UNREAL_ENGINE_LOGIN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve EAC SDK (real vs stub)
        # SDK real do EAC (KHAAOS_EAC_SDK_DIR / EACSDK/ local / EAC_SDK_URL).
        # Sem SDK o build segue em stub — nunca quebra (contrato UE1040);
        # go-live usa bash scripts/build/setup_eac_sdk.sh --require.
        run: |
          set -euo pipefail
          eval "$(bash scripts/build/setup_eac_sdk.sh --emit-env)"
          echo "EAC_SDK_MODE=${EAC_SDK_MODE}" >> $GITHUB_ENV
          if [[ "${EAC_SDK_MODE}" == "real" ]]; then
            echo "KHAAOS_EAC_SDK_DIR=${KHAAOS_EAC_SDK_DIR}" >> $GITHUB_ENV
          fi
          echo "EAC mode: ${EAC_SDK_MODE}"

      - name: Build target with UBT
        env:
          UPROJECT: ${{ github.workspace }}/Unreal/KhaaosRun/KhaaosRun.uproject
        run: |
          set -euo pipefail
          UBT="/home/ue4/UnrealEngine/Engine/Build/BatchFiles/Build.sh"
          if [ ! -f "$UBT" ]; then
            # Layout das imagens dev varia (ENGINE_DIR pode diferir).
            UBT="$(find / -maxdepth 6 -path '*/Engine/Build/BatchFiles/Build.sh' 2>/dev/null | head -1)"
          fi
          if [ -z "$UBT" ]; then
            echo "::error::Build.sh da engine não encontrado na imagem — ajuste a variable UE_CONTAINER_IMAGE"
            exit 1
          fi
          bash "$UBT" ${{ github.event.inputs.target || 'KhaaosRunServer' }} Linux \
            ${{ github.event.inputs.configuration || 'Development' }} -project="$UPROJECT" -waitmutex

      - name: "EAC Dedicated Smoke (exigir 'EAC Status: Active' no binário construído)"
        # Fase 0.3 (auditoria): valida o binário do servidor dedicado REAL
        # construído no passo anterior. Com SDK real o smoke é ESTRITO (exit 0
        # só com 'EAC Status: Active' no log); com stub marca SKIPPED
        # (contrato UE1040) — go-live exige reexecução estrita com SDK.
        run: |
          set -euo pipefail
          if [[ "${EAC_SDK_MODE:-stub}" != "real" ]]; then
            echo "::warning::EAC SDK ausente — smoke estrito SKIPPED (go-live exige SDK real + 'EAC Status: Active')"
            node scripts/build/eac_dedicated_smoke.mjs --allow-missing-input \
              --reason "SDK stub: servidor dedicado logaria 'Running (stub)', nunca Active"
          else
            SERVER_BIN="$(find Unreal/KhaaosRun/Binaries/Linux -maxdepth 1 -name 'KhaaosRunServer*' 2>/dev/null | head -1 || true)"
            if [[ -z "${SERVER_BIN}" ]]; then
              echo "::error::SDK real presente mas binário do servidor não encontrado em Binaries/Linux"
              exit 1
            fi
            node scripts/build/eac_dedicated_smoke.mjs --binary "${SERVER_BIN}" --timeout-ms 180000
          fi

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: khaaos-${{ github.event.inputs.target || 'KhaaosRunServer' }}-${{ github.event.inputs.configuration || 'Development' }}-${{ github.sha }}
          path: |
            Unreal/KhaaosRun/Binaries/Linux/*
          if-no-files-found: error
          retention-days: 14
