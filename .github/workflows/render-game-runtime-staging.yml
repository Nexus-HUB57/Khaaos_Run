name: "Game Runtime — reaproveitar serviço staging Render (temporário)"

# O Render exige cartão para NOVOS serviços (HTTP 402 na conta). Este workflow
# REAPROVEITA o serviço existente khaaos-run-staging para rodar o servidor
# autoritativo do jogo (game-runtime: /auth/login, /ws) necessário ao despacho
# único MP-ZEX 08+09. Após o despacho, execute
# "Staging — restaurar economy (main)" para devolver o serviço à API economy
# no main — restauração coberta por render-staging-restore-economy.yml.
# A configuração original é impressa no step summary antes de qualquer mudança.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-game-runtime-staging
  cancel-in-progress: false

jobs:
  repurpose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RENDER_API: https://api.render.com/v1
      SERVICE_ID: srv-db6183o473hc73co8n10
    steps:
      - uses: actions/checkout@v4

      - name: Capturar e publicar configuração original
        env:
          API_KEY_RENDER: ${{ secrets.API_KEY_RENDER }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $API_KEY_RENDER" "$RENDER_API/services/$SERVICE_ID" > /tmp/svc.json
          {
            echo "## Configuração original (restaurável via render-staging-restore-economy.yml)"
            jq '{name, branch, autoDeploy, serviceDetails: {env: .serviceDetails.env, buildPlan: .serviceDetails.buildPlan, healthCheckPath: .serviceDetails.healthCheckPath, buildCommand: .serviceDetails.envSpecificDetails.buildCommand, startCommand: .serviceDetails.envSpecificDetails.startCommand}}' /tmp/svc.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alinhar KR_USERS_JSON (hash local, senhas só do environment)
        env:
          API_KEY_RENDER: ${{ secrets.API_KEY_RENDER }}
          KR_STAGING_TEST_USER_A: ${{ secrets.KR_STAGING_TEST_USER_A }}
          KR_STAGING_TEST_PASSWORD_A: ${{ secrets.KR_STAGING_TEST_PASSWORD_A }}
          KR_STAGING_TEST_USER_B: ${{ secrets.KR_STAGING_TEST_USER_B }}
          KR_STAGING_TEST_PASSWORD_B: ${{ secrets.KR_STAGING_TEST_PASSWORD_B }}
        run: |
          set -euo pipefail
          users_json=$(node --input-type=module -e '
            const { hashPassword } = await import("./game-runtime/server/auth.js");
            const j = (u, p) => ({ id: u, username: u, role: "player", region: "sa-east", passwordHash: hashPassword(p) });
            process.stdout.write(JSON.stringify([
              j(process.env.KR_STAGING_TEST_USER_A, process.env.KR_STAGING_TEST_PASSWORD_A),
              j(process.env.KR_STAGING_TEST_USER_B, process.env.KR_STAGING_TEST_PASSWORD_B),
            ]));
          ')
          http=$(curl -s -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $API_KEY_RENDER" -H "Content-Type: application/json" \
            -d "$(jq -n --arg v "$users_json" '{value: $v}')" \
            "$RENDER_API/services/$SERVICE_ID/env-vars/KR_USERS_JSON")
          [[ "$http" =~ ^2 ]] || { echo "::error::Falha ao gravar KR_USERS_JSON (HTTP $http)"; exit 1; }
          echo "KR_USERS_JSON alinhado (2 contas, hash apenas)"

      - name: Reapontar serviço para game-runtime (branch main)
        env:
          API_KEY_RENDER: ${{ secrets.API_KEY_RENDER }}
        run: |
          set -euo pipefail
          payload=$(jq -n '{
            autoDeploy: "no",
            branch: "main",
            serviceDetails: {
              env: "node",
              healthCheckPath: "/healthz",
              envSpecificDetails: {
                buildCommand: "cd game-runtime && npm ci --omit=dev",
                startCommand: "cd game-runtime && node server/server.js"
              }
            }
          }')
          http=$(curl -s -o /tmp/upd.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $API_KEY_RENDER" -H "Content-Type: application/json" \
            -d "$payload" "$RENDER_API/services/$SERVICE_ID")
          [[ "$http" =~ ^2 ]] || { echo "::error::Falha ao reapontar serviço (HTTP $http)"; cat /tmp/upd.json | cut -c1-400; exit 1; }
          echo "Serviço reapontado para game-runtime (branch main)"

      - name: Deploy e aguardar live
        env:
          API_KEY_RENDER: ${{ secrets.API_KEY_RENDER }}
        run: |
          set -euo pipefail
          deploy_id=$(curl -s -X POST -H "Authorization: Bearer $API_KEY_RENDER" \
            -H "Content-Type: application/json" -d '{"clearCache": "clear"}' \
            "$RENDER_API/services/$SERVICE_ID/deploys" | jq -r '.id // empty')
          [[ -n "$deploy_id" ]] || { echo "::error::Render não aceitou o deploy"; exit 1; }
          for i in $(seq 1 60); do
            status=$(curl -s -H "Authorization: Bearer $API_KEY_RENDER" \
              "$RENDER_API/services/$SERVICE_ID/deploys/$deploy_id" | jq -r '.status')
            echo "deploy → $status (tentativa $i)"
            case "$status" in
              live) exit 0 ;;
              deploy_failed|build_failed|canceled|deactivated)
                echo "::error::Deploy terminou com status $status"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timeout aguardando deploy live"; exit 1

      - name: Healthcheck público (/healthz)
        run: |
          set -euo pipefail
          url="https://khaaos-run-staging.onrender.com"
          for i in $(seq 1 20); do
            body=$(curl -s --max-time 10 "$url/healthz" || true)
            if echo "$body" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "HEALTH_OK $url"
              {
                echo "## Game runtime no ar (temporário)"
                echo "- URL: $url (host rotulado staging ✓)"
                echo "Próximo passo: despachar **MP-ZEX 08+09 — Despacho único em staging**"
                echo "Depois: Actions → **Staging — restaurar economy (main)**"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::/healthz não respondeu ok"; exit 1
