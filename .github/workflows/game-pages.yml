name: Publish Khaaos Run game site

on:
  push:
    branches: [main]
    paths:
      - "game-runtime/**"
      - ".github/workflows/game-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-runtime/package-lock.json

      - name: Install game dependencies
        run: npm ci --prefix game-runtime

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static game site
        run: npm run build --prefix game-runtime -- --base=/Khaaos_Run/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game-runtime/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
