# =============================================================================
# Production overrides applied on top of the base docker-compose.yml.
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.production.yml \
#     up -d
#
# This file adds:
#   - Resource limits (CPU/memory) per service
#   - Health checks for all services
#   - Restart policies (unless-stopped)
#   - Logging (json-file, max-size 50m, max-file 5)
#   - Network isolation
#   - Volume mounts for persistence
#   - Environment variable references (not hardcoded)
#   - AlertManager service (port 9093)
#   - Prometheus with production config
#   - Grafana with provisioning
# =============================================================================

version: "3.9"

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "khaaos.{{.Name}}"

x-common-restart: &common-restart
  restart: unless-stopped

x-common-deploy: &common-deploy
  restart_policy:
    condition: unless-stopped
    delay: 5s
    max_attempts: 5
    window: 120s

services:
  # ══ Khaaos Run Dedicated Server ══════════════════════════════════════════════
  khaaos-server:
    <<: *common-restart
    environment:
      SERVER_NAME: ${SERVER_NAME:-KhaaosRun-Alpha}
      MAX_PLAYERS: ${MAX_PLAYERS:-100}
      MAP_NAME: ${MAP_NAME:-CIGKV}
      GAME_MODE: ${GAME_MODE:-KhaaosGameMode}
      TICK_RATE: ${TICK_RATE:-60}
      REGION: ${REGION:-sa1}
      # EOS credentials (from environment — never hardcoded)
      EOS_PRODUCT_ID: ${EOS_PRODUCT_ID:-}
      EOS_SANDBOX_ID: ${EOS_SANDBOX_ID:-}
      EOS_DEPLOYMENT_ID: ${EOS_DEPLOYMENT_ID:-}
      EOS_CLIENT_ID: ${EOS_CLIENT_ID:-}
      EOS_CLIENT_SECRET: ${EOS_CLIENT_SECRET:-}
      # Service URLs
      REDIS_URL: redis://redis:6379
      ECONOMY_API_URL: http://economy-api:3000
      # Production flags
      KHAAOS_PRODUCTION: "true"
      KHAAOS_ENVIRONMENT: ${KHAAOS_ENVIRONMENT:-alpha}
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f KhaaosRunServer > /dev/null && curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    volumes:
      - server-logs:/home/khaaos/server/KhaaosRun/Saved/Logs
      - server-config:/home/khaaos/server/KhaaosRun/Saved/Config
      - server-cloud:/home/khaaos/server/KhaaosRun/Saved/Cloud
    networks:
      - khaaos-backend
      - khaaos-frontend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE

  # ══ Economy Microservice ═════════════════════════════════════════════════════
  economy-api:
    <<: *common-restart
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      REDIS_REQUIRED: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      KRC_SINK_RATE: ${KRC_SINK_RATE:-0.95}
      KRC_FAUCET_RATE: ${KRC_FAUCET_RATE:-1.0}
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - economy-logs:/app/logs
    networks:
      - khaaos-backend
    read_only: false
    security_opt:
      - no-new-privileges:true

  # ══ PostgreSQL ══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: khaaos-postgres
    <<: *common-restart
    environment:
      POSTGRES_DB: ${DB_NAME:-khaaos_db}
      POSTGRES_USER: ${DB_USER:-khaaos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-khaaos} -d ${DB_NAME:-khaaos_db}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - khaaos-backend
    shm_size: 256m

  # ══ Redis ═══════════════════════════════════════════════════════════════════
  redis:
    <<: *common-restart
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --save 60 1000
      --save 300 100
      --save 900 1
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "1.0"
          memory: ${REDIS_MAX_MEMORY:-512mb}
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - khaaos-backend

  # ══ Prometheus ══════════════════════════════════════════════════════════════
  prometheus:
    <<: *common-restart
    image: prom/prometheus:v2.48.0
    container_name: khaaos-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-15d}"
      - "--storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-10GB}"
      - "--web.enable-lifecycle"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--rules.alert.resend-delay=5m"
    environment:
      ENVIRONMENT: ${KHAAOS_ENVIRONMENT:-alpha}
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/alerting/khaaos-alerts.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - khaaos-backend
      - khaaos-monitoring

  # ══ AlertManager ════════════════════════════════════════════════════════════
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: khaaos-alertmanager
    <<: *common-restart
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
      - "--cluster.listen-address="
    environment:
      # Webhook URLs (from environment — never hardcoded)
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_CRITICAL_WEBHOOK_URL: ${DISCORD_CRITICAL_WEBHOOK_URL:-}
      DISCORD_SECURITY_WEBHOOK_URL: ${DISCORD_SECURITY_WEBHOOK_URL:-}
      SLACK_CRITICAL_WEBHOOK_URL: ${SLACK_CRITICAL_WEBHOOK_URL:-}
      SLACK_WARNING_WEBHOOK_URL: ${SLACK_WARNING_WEBHOOK_URL:-}
      SLACK_SECURITY_WEBHOOK_URL: ${SLACK_SECURITY_WEBHOOK_URL:-}
      # Grafana & admin URLs
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      RUNBOOK_URL: ${RUNBOOK_URL:-https://wiki.khaaos.run/runbooks}
      ADMIN_API_URL: ${ADMIN_API_URL:-http://economy-api:3000}
      # SMTP (fallback)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
    ports:
      - "9093:9093"
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ../../infra/alerting/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - khaaos-backend
      - khaaos-monitoring
    depends_on:
      prometheus:
        condition: service_healthy

  # ══ Grafana ═════════════════════════════════════════════════════════════════
  grafana:
    <<: *common-restart
    image: grafana/grafana:10.2.0
    container_name: khaaos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console file
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/khaaos-production.json
      # SMTP for alert notifications
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED:-false}"
      GF_SMTP_HOST: "${SMTP_HOST:-}:${SMTP_PORT:-587}"
      GF_SMTP_FROM_ADDRESS: "grafana@khaaos.run"
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../infra/grafana:/var/lib/grafana/dashboards:ro
    networks:
      - khaaos-frontend
      - khaaos-monitoring
    depends_on:
      prometheus:
        condition: service_healthy

  # ══ Prometheus Pushgateway (for batch jobs) ══════════════════════════════════
  pushgateway:
    image: prom/pushgateway:v1.7.0
    container_name: khaaos-pushgateway
    <<: *common-restart
    ports:
      - "9091:9091"
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - khaaos-monitoring

  # ══ Node Exporter (host metrics) ═════════════════════════════════════════════
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: khaaos-node-exporter
    <<: *common-restart
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - khaaos-monitoring

  # ══ Discord Bot ═══════════════════════════════════════════════════════════════════
  discord-bot:
    build:
      context: ../../infra/discord-bot
      dockerfile: Dockerfile
    container_name: khaaos-discord-bot
    <<: *common-restart
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_BETA_ROLE_ID: ${DISCORD_BETA_ROLE_ID:-}
      KHAASOS_API_BASE: ${KHAASOS_API_BASE:-http://economy-api:3000}
      KHAASOS_API_KEY: ${KHAASOS_API_KEY:-}
      LOG_LEVEL: ${DISCORD_BOT_LOG_LEVEL:-info}
    logging: *common-logging
    deploy:
      <<: *common-deploy
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - khaaos-backend
    depends_on:
      economy-api:
        condition: service_healthy

# ══ Volumes ═══════════════════════════════════════════════════════════════════════
volumes:
  server-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/khaaos/server/logs

  server-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/khaaos/server/config

  server-cloud:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/khaaos/server/cloud

  economy-logs:
    driver: local

  postgres-data:
    driver: local

  redis-data:
    driver: local

  prometheus-data:
    driver: local

  alertmanager-data:
    driver: local

  grafana-data:
    driver: local

# ══ Networks ══════════════════════════════════════════════════════════════════════
networks:
  # Backend: server-to-service communication only
  khaaos-backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.28.0.0/20
    internal: false

  # Frontend: externally accessible services only
  khaaos-frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.28.16.0/20
    internal: false

  # Monitoring: Prometheus, Grafana, AlertManager, exporters
  # Isolated from game traffic
  khaaos-monitoring:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.28.32.0/20
    internal: true
