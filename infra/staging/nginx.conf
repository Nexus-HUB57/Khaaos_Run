# Khaaos Run — nginx LB do staging: round-robin DNS sobre as réplicas do app.
# O upstream é resolvido por requisição (resolver docker 127.0.0.11) para que
# `docker compose up --scale app=N` seja respeitado sem recarregar o nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 8080;
  server_name _;

  # Buffer pequeno: payloads do runtime são JSON compacto (< 16 KiB).
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;

  # Liveness/readiness passam direto para as réplicas (rotação por DNS).
  location ~ ^/(healthz|readyz)$ {
    set $app_backend "app:8787";
    proxy_pass http://$app_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket autoritativo: upgrade transparente.
  location /ws {
    set $app_backend "app:8787";
    proxy_pass http://$app_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Demais rotas HTTP (auth, admin, economy, traces/logs).
  location / {
    set $app_backend "app:8787";
    proxy_pass http://$app_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
