# =============================================================================
# Khaaos Run — Stack de staging com PostgreSQL e Redis REAIS
# =============================================================================
# Uso (a partir desta pasta):
#   cp .env.example .env   # ajuste ADMIN_TOKEN/segredos
#   bash deploy.sh         # sobe tudo, aplica migrações, espera readyz
#   bash verify.sh         # valida readyz + gate de conexões + LB round-robin
# Escala manual/automática:
#   docker compose up -d --no-deps --scale app=3
#   node autoscaler.mjs    # daemon que lê /healthz e escala sozinho
#
# KR_READY_MAX_CONNECTIONS ativa o gate de saturação do /readyz (503 overload
# para o balanceador tirar a réplica da rotação) e alimenta a leitura do
# autoscaler (decide() em autoscaler.mjs).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KR_PG_DB:-khaaos_staging}
      POSTGRES_USER: ${KR_PG_USER:-khaaos}
      POSTGRES_PASSWORD: ${KR_PG_PASSWORD:?configure KR_PG_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KR_PG_USER:-khaaos} -d ${KR_PG_DB:-khaaos_staging}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Migração one-shot: `docker compose run --rm migrate` (deploy.sh faz isso).
  migrate:
    build:
      context: ../..
      dockerfile: game-runtime/Dockerfile
    entrypoint: ["npm", "run", "db:migrate"]
    environment:
      KR_DATABASE_URL: postgres://khaaos:${KR_PG_PASSWORD}@postgres:5432/${KR_PG_DB:-khaaos_staging}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: game-runtime/Dockerfile
    environment:
      PORT: "8787"
      KR_DATABASE_URL: postgres://khaaos:${KR_PG_PASSWORD}@postgres:5432/${KR_PG_DB:-khaaos_staging}
      KR_RATE_STORE: redis
      KR_REDIS_URL: redis://redis:6379
      KR_AUDIT_STORE: postgres
      KR_ECONOMY_STORE: postgres
      ADMIN_TOKEN: ${ADMIN_TOKEN:?configure ADMIN_TOKEN no .env}
      AUTH_SECRET: ${AUTH_SECRET:?configure AUTH_SECRET no .env}
      # Gate de saturação do readiness: > N conexões vivas → 503 overload
      # (réplica sai da rotação do nginx/HPA até esvaziar).
      KR_READY_MAX_CONNECTIONS: ${KR_READY_MAX_CONNECTIONS:-2000}
      # Regionalização para autoscaling por região (via /healthz regions[]).
      KR_REGION: ${KR_REGION:-sa-east}
      MATCH_SEED: ${MATCH_SEED:-CIGKV-staging}
      # Nunca em staging aberto: autenticação dev desligada por padrão.
      KR_DEV_AUTH: "0"
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KR_STAGING_PORT:-8080}:8080"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
