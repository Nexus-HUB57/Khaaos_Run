# Khaaos Run — nginx LB do staging em MODO 2 RÉPLICAS (override M4).
# Upstream ESTÁTICO app-a/app-b: os ids de réplica e endereços do redirect
# cross-réplica são determinísticos (docker-compose.2replicas.yml).
# O modo padrão (nginx.conf) mantém round-robin DNS para --scale app=N.

upstream khaaos_app_2r {
  server app-a:8787;
  server app-b:8787;
}

server {
  listen 8080;
  server_name _;

  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;

  # Liveness/readiness passam direto para as réplicas (round-robin fixo).
  location ~ ^/(healthz|readyz)$ {
    proxy_pass http://khaaos_app_2r;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket autoritativo: upgrade transparente.
  location /ws {
    proxy_pass http://khaaos_app_2r;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Demais rotas HTTP (auth, admin, economy, traces/logs, metrics).
  location / {
    proxy_pass http://khaaos_app_2r;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
