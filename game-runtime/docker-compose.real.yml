services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khaaos_runtime
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime_dev_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d khaaos_runtime"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - khaaos-runtime-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - khaaos-runtime-redis:/data

volumes:
  khaaos-runtime-postgres:
  khaaos-runtime-redis:
