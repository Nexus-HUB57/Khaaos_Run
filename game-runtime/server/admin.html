<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KR // Command Monitor</title><style>body{margin:0;background:#080a0d;color:#d8e0e4;font:14px Arial,sans-serif;padding:24px}h1{color:#c8ff3d;letter-spacing:.1em}.toolbar{display:flex;gap:8px;margin-bottom:18px}input,button{background:#10171c;border:1px solid #33434b;color:#d8e0e4;padding:10px}button{color:#c8ff3d;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card,table{background:#10151a;border:1px solid #26313a}.card{padding:14px}.card small{color:#71808a;display:block}.card b{font-size:24px;color:#c8ff3d}.card.spec{border-color:#1f5f66}.card.spec small{color:#42d9de}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{text-align:left;padding:10px;border-bottom:1px solid #26313a}th{color:#42d9de;font-size:11px}tr.alert{background:#2c151b;color:#ff7f89}.ok{color:#c8ff3d}.danger{color:#ff3d52}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>KHAAOS RUN // COMMAND MONITOR</h1><div class="toolbar"><input id="token" placeholder="ADMIN_TOKEN" type="password"><button id="connect">CONECTAR MONITOR</button><span id="status">OFFLINE</span></div><div id="cards" class="cards"></div><table><thead><tr><th>CLIENTE</th><th>ROOM</th><th>STRIKES</th><th>ESTADO</th></tr></thead><tbody id="clients"></tbody></table><h2>Salas</h2><table><thead><tr><th>RING</th><th>SEED</th><th>PLAYERS</th><th>VIVOS</th><th>ESPECTADORES</th><th>ESTADO</th></tr></thead><tbody id="rooms"></tbody></table><h2>Diretor da Transmissão</h2><table><thead><tr><th>MÉTRICA</th><th>VALOR</th></tr></thead><tbody id="director"></tbody></table><script>let timer;const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const kb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(1)+' KB':String(b)+' B';function render(d){document.querySelector('#status').textContent='ONLINE // '+new Date(d.now).toLocaleTimeString();const cards=[['CONEXÕES',d.metrics.connections],['MENSAGENS',d.metrics.messages],['REJEIÇÕES',d.metrics.rejections],['VIOLAÇÕES',d.metrics.violations],['BANS',d.metrics.bans]];const spec=d.spectators;if(spec){cards.push(['ESPECTADORES',spec.totalSpectators],['PICO',spec.peakSpectators],['PACOTES TV',spec.totals.packetsSent],['BYTES TV',kb(spec.totals.bytesSent)]);}const dir=spec&&spec.director?spec.director:null;if(dir){cards.push(['CORTES TV',dir.cuts.total],['MANUAL',dir.manual.followSelects+dir.manual.cycles]);}document.querySelector('#cards').innerHTML=cards.map((x,i)=>`<div class="card${spec&&i>=5?' spec':''}"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');document.querySelector('#clients').innerHTML=(d.clients||[]).map(c=>`<tr class="${c.suspicious?'alert':''}"><td>${esc(c.id)}</td><td>${esc(c.roomId||'fila')}</td><td>${c.strikes}</td><td class="${c.suspicious?'danger':'ok'}">${c.suspicious?'SUSPEITO':'NORMAL'}</td></tr>`).join('');document.querySelector('#rooms').innerHTML=d.rooms.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.seed)}</td><td>${r.players}/${r.capacity}</td><td>${r.alive}</td><td>${r.spectators??0}${spec&&spec.totalSpectators>0?' <em class="ok">LIVE</em>':''}</td><td>${r.started?'EM BATALHA':'AGUARDANDO'}</td></tr>`).join('');document.querySelector('#director').innerHTML=dir?[['CORTE: hazard-start',dir.cuts.byReason['hazard-start']],['CORTE: target-lost',dir.cuts.byReason['target-lost']],['CORTE: escalada',dir.cuts.byReason['hazard-escalation']],['TSUNAMI',dir.cuts.byHazard['tsunami']],['LAVA',dir.cuts.byHazard['lava']],['ANOMALIA KHAOS',dir.cuts.byHazard['gravity']],['ÁCIDO',dir.cuts.byHazard['acid']],['MANUAL (cliques/ciclos)',dir.manual.followSelects+'/'+dir.manual.cycles],['AUTO ON/OFF',dir.toggles.on+'/'+dir.toggles.off],['REPORTANDO',dir.reporting+' esp. ('+dir.enabled+' auto)']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]??0}</td></tr>`).join(''):'<tr><td>sem dados do diretor</td><td>—</td></tr>';}document.querySelector('#connect').onclick=()=>{clearInterval(timer);const token=encodeURIComponent(document.querySelector('#token').value);const poll=()=>fetch('/admin/metrics?token='+token).then(r=>{if(!r.ok)throw Error('unauthorized');return r.json()}).then(render).catch(()=>document.querySelector('#status').textContent='TOKEN INVÁLIDO / OFFLINE');poll();timer=setInterval(poll,1000)};</script></body></html>
